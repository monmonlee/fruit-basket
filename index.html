<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>水果籃運動週卡</title>
<meta name="description" content="每週重訓加有氧的打卡卡片，每打卡一次就在籃子裡多放一顆水果。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="icons/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="水果籃">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F2F4FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1925" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one narrow phone column. "Today" tiles first, basket, season card, stats; every session opens the same bottom sheet. */
:root{
  --bg:#F2F4FA; --card:#FFFFFF; --ink:#2A2540; --muted:#7A7594; --line:#E3E1EF;
  --lilac:#8C7BF0; --lilac-soft:#ECE8FF; --mint:#3FBF97; --mint-soft:#DDF5EC;
  --gecko:#F6C945; --gecko-line:#D9A520; --spot:#6B4E3D; --spot-off:#F9E2A0;
  --warn:#E5734F;
  --winter:#6F9BE0; --spring:#5BB877; --summer:#E9A623; --autumn:#D9774A; --peach:#F08B6E; --winter-soft:#DCE7FA;
  --basket:#E3B27A; --basket-line:#B5803F; --basket-in:#C99256;
  --font:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --num:"Fredoka","Huninn","PingFang TC",sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1925; --card:#26233A; --ink:#EEEBFA; --muted:#A39DC0; --line:#38344F;
  --lilac:#A598FF; --lilac-soft:#35305A; --mint:#5AD8B0; --mint-soft:#1F4038;
  --gecko:#F2C744; --gecko-line:#C99A1C; --spot:#5A3F30; --spot-off:#8A7330; --warn:#F08A68; --winter-soft:#2B3552;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1925; --card:#26233A; --ink:#EEEBFA; --muted:#A39DC0; --line:#38344F;
  --lilac:#A598FF; --lilac-soft:#35305A; --mint:#5AD8B0; --mint-soft:#1F4038;
  --gecko:#F2C744; --gecko-line:#C99A1C; --spot:#5A3F30; --spot-off:#8A7330; --warn:#F08A68; --winter-soft:#2B3552;
  color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
[hidden]{display:none!important}
html,body{margin:0;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--lilac);outline-offset:2px;border-radius:10px}

/* week nav */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weeknav button{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-family:var(--num);font-size:20px;line-height:1}
.weeknav .mid{text-align:center}
.weeknav .range{font-family:var(--num);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.weeknav .tag{font-size:12px;color:var(--muted);letter-spacing:.08em}
.weeknav .tag.now{color:var(--lilac)}

/* hero */
.hero{background:var(--card);border-radius:28px;padding:16px 16px 18px;display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line)}
.hero svg{width:100%;max-width:300px;height:auto;display:block}
.score{font-family:var(--num);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:20px;color:var(--muted);font-weight:500}
.bubble{background:var(--lilac-soft);color:var(--ink);border-radius:16px;padding:6px 14px;font-size:15px;text-align:center;text-wrap:balance}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:3px}
.legend svg{width:18px;height:18px}
.wiggle{animation:wig .6s ease}
@keyframes wig{0%,100%{transform:rotate(0)}30%{transform:rotate(-4deg)}60%{transform:rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.wiggle{animation:none}}

/* sections */
h2{font-size:18px;font-weight:400;margin:0;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h2 span{font-size:12px;color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:10px}
.tip{font-size:13px;color:var(--muted);margin:0}

/* today tiles */
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.tile svg{width:42px;height:42px}
.tile b{font-weight:400;font-size:15px}
.tile small{font-size:11px;color:var(--muted);font-family:var(--num);font-weight:500;white-space:nowrap}
.tile.done{border-color:var(--lilac);background:var(--lilac-soft)}
.tile.done small{color:var(--lilac)}
.tile.going{border-color:var(--peach);border-style:dashed}
.tile.going small{color:var(--peach)}
.tile:active{transform:scale(.97)}

/* bottom sheet: the one place every session is logged */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end}
.backdrop{position:absolute;inset:0;background:rgba(20,16,40,.45);border:0;width:100%}
.sheet{position:relative;background:var(--bg);border-radius:24px 24px 0 0;max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;width:100%;max-width:520px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.2);animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
.sheet header{display:flex;align-items:center;gap:10px;padding:8px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));flex:none}
.sheet header svg{width:38px;height:38px;flex:none}
.sheet header h3{margin:0;font-size:18px;font-weight:400;flex:1;min-width:0}
.sheet header h3 small{display:block;font-size:12px;color:var(--muted)}
.xbtn{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:15px;flex:none}
.sheet-body{overflow-y:auto;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.stage{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.stage h4{margin:0;font-size:14px;font-weight:400;display:flex;align-items:center;gap:8px}
.stage h4 i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--lilac-soft);color:var(--lilac);display:grid;place-items:center;font-family:var(--num);font-weight:600;font-size:13px}
.stage.cur{border-color:var(--lilac)}
.stage.cur h4 i{background:var(--lilac);color:#fff}
.timeline{margin:0;font-size:13px;color:var(--muted)}
.timeline b{color:var(--ink);font-weight:400}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.go-btn{padding:12px;border-radius:14px;background:var(--peach);color:#fff;font-size:16px}
.ghost{padding:10px;border-radius:12px;background:var(--bg);font-size:14px}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.item{display:flex;flex-direction:column;gap:8px;padding:8px 10px;border-radius:12px;background:var(--bg)}
.item.ok{background:var(--lilac-soft)}
.irow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.irow .nm{text-align:left;padding:0}
.ed{font-size:12px;color:var(--lilac);white-space:nowrap}
.item.wc .nm span{color:var(--muted)}
.iedit{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:4px;border-top:1px dashed var(--line)}
.iedit .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld label{font-size:12px;color:var(--muted)}
.fld input{width:100%;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 9px;font-size:14px}
.fld .row{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.fld .row button{width:30px;height:30px;border-radius:8px;background:var(--bg);font-family:var(--num);font-size:17px;line-height:1}
.fld .row output{font-family:var(--num);font-weight:600;font-size:17px}
.idel{grid-column:1/-1;justify-self:start;font-size:13px;color:var(--warn);padding:4px 0}
.addone{padding:9px;border-radius:12px;border:1.5px dashed var(--line);color:var(--muted);font-size:14px}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;color:#fff;font-size:15px}
.item.ok .check{background:var(--lilac);border-color:var(--lilac)}
.item .nm{min-width:0}
.item .nm b{font-weight:400;display:block;overflow-wrap:anywhere}
.item .nm span{font-size:12px;color:var(--muted)}
.kg{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 8px;font-family:var(--num);font-size:14px;text-align:center}
.empty{font-size:13px;color:var(--muted);background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.pain{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{background:var(--bg);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;align-items:center}
.step label{font-size:12px;color:var(--muted)}
.step .row{display:flex;align-items:center;gap:10px}
.step button.pm{width:30px;height:30px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-family:var(--num);font-size:18px;line-height:1}
.step output{font-family:var(--num);font-weight:600;font-size:20px;min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.stamp-btn{width:100%;padding:12px;border-radius:14px;background:var(--lilac);color:#fff;font-size:16px}
.stamp-btn.undo{background:var(--bg);color:var(--muted)}

/* menu editor */
details.menu{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:4px 14px}
details.menu summary{padding:10px 0;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.menu summary::-webkit-details-marker{display:none}
details.menu summary span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:8px;border-radius:12px;background:var(--bg);color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--lilac);color:#fff}
.mrows{display:flex;flex-direction:column;gap:6px}
.mrow{display:grid;grid-template-columns:1fr 1fr 1fr 34px;gap:6px;padding:8px;border-radius:12px;background:var(--bg)}
.mrow .mname{grid-column:1/4}
.mrow input{width:100%;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 9px;font-size:14px}
.mrow button{border-radius:10px;background:var(--card);color:var(--warn);font-size:16px}
.mrow small{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.mactions{display:flex;gap:8px;padding:10px 0 12px}
.mactions button{flex:1;padding:10px;border-radius:12px;background:var(--bg)}
.mactions .save{background:var(--lilac);color:#fff}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.stat span{font-size:12px;color:var(--muted);display:block}
.stat b{font-family:var(--num);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);text-align:center}
.app .app{max-width:none;margin:0;width:100%}

/* view tabs */
.views{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px;gap:4px}
.views button{flex:1;padding:8px;border-radius:99px;color:var(--muted)}
.views button[aria-selected="true"]{background:var(--lilac);color:#fff}

/* month calendar */
.mstats{display:grid;grid-template-columns:repeat(12,1fr);gap:8px}
.mstats .stat{grid-column:span 3}
.cal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px}
.dow,.wrow{display:grid;grid-template-columns:repeat(7,1fr) 30px;gap:4px}
.dow{font-size:12px;color:var(--muted);text-align:center;margin-bottom:6px}
.dow::after{content:""}
.grid{display:flex;flex-direction:column;gap:4px}
.day{aspect-ratio:1;max-width:100%;border-radius:12px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:4px;gap:2px;min-width:0}
.day.out{opacity:.35}
.day.today{outline:2px solid var(--lilac);outline-offset:-2px}
.day .dn{font-family:var(--num);font-size:13px;font-weight:500;line-height:1.2;font-variant-numeric:tabular-nums}
.day .ev{display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
.day .ev{gap:0;flex-wrap:nowrap;align-items:center;max-width:100%}
.day .ev svg{width:15px;height:15px;flex:none}
.day .ev svg+svg{margin-left:-6px}
.day .ev .more{font-family:var(--num);font-size:10px;font-weight:600;color:var(--muted);margin-left:1px}
.wsum{display:grid;place-items:center;font-family:var(--num);font-weight:600;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.wsum.full{color:var(--mint)}
.update{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;
  display:flex;align-items:center;gap:10px;background:var(--lilac);color:#fff;border-radius:99px;padding:8px 8px 8px 16px;
  box-shadow:0 6px 20px rgba(60,40,140,.25);max-width:calc(100% - 32px);font-size:14px}
.update span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.update button{background:#fff;color:var(--lilac);border-radius:99px;padding:6px 14px;font-size:14px;white-space:nowrap}
/* fruit tree: one branch per exercise, one fruit per set */
.wcrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wcbtn{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--bg);font-size:14px;text-align:left}
.wcbtn .check{width:22px;height:22px;font-size:13px;flex:none}
.wcbtn.ok{background:var(--lilac-soft)}
.wcbtn.ok .check{background:var(--lilac);border-color:var(--lilac)}
.tree{position:relative;display:flex;flex-direction:column;gap:14px;padding:22px 0 18px}
.tree::before{content:"";position:absolute;left:81px;top:16px;bottom:10px;width:7px;border-radius:4px;background:var(--basket-line)}
.tree::after{content:"";position:absolute;left:62px;top:0;width:46px;height:28px;border-radius:50%;background:#6CC66F;box-shadow:-14px 6px 0 -4px #5DBB63,14px 6px 0 -4px #5DBB63}
.soil{position:absolute;left:52px;bottom:0;width:66px;height:12px;border-radius:50%;background:var(--basket-in);opacity:.8}
.branch{display:grid;grid-template-columns:72px 1fr;align-items:start;gap:18px;position:relative}
.bname{text-align:right;font-size:13px;line-height:1.25;overflow-wrap:anywhere;padding:6px 0 0}
.bname small{display:block;font-size:10px;color:var(--muted)}
.bname.sel{color:var(--lilac)}
.twig{position:relative;display:flex;flex-wrap:wrap;gap:2px 4px;align-items:flex-start;min-width:0}
.twig::before{content:"";position:absolute;left:-12px;right:6px;top:15px;height:3px;border-radius:2px;background:var(--basket-line);opacity:.75}
.fr{position:relative;display:flex;flex-direction:column;align-items:center;width:42px;padding:0;border-radius:12px}
.fr svg{width:32px;height:32px}
.fr small{font-family:var(--num);font-size:10px;color:var(--muted);line-height:1.15;white-space:nowrap;background:var(--card);border-radius:4px;padding:0 2px}
.fr.ripe small{color:var(--ink)}
.fr.sel{background:var(--lilac-soft);outline:2px solid var(--lilac)}
.fr.plus svg{opacity:.55}
.harvest{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.harvest b{font-family:var(--num);color:var(--ink);font-weight:600}
.setedit{background:var(--bg);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.setedit h5{margin:0;font-size:14px;font-weight:400;display:flex;justify-content:space-between;align-items:center}
.setedit .two{grid-template-columns:1fr 1fr}
.setedit .acts{display:flex;flex-wrap:wrap;gap:6px}
.setedit .acts button{padding:7px 10px;border-radius:10px;background:var(--card);font-size:13px}
.setedit .acts .danger{color:var(--warn)}
.ripe-btn{padding:11px;border-radius:12px;background:var(--lilac);color:#fff;font-size:15px}
.ripe-btn.undo{background:var(--card);color:var(--muted)}
/* extras */
.xlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.xitem{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;background:var(--bg);border-radius:14px;padding:8px 10px}
.xitem svg{width:30px;height:30px}
.xitem b{font-weight:400;display:block}
.xitem span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.xitem button{color:var(--warn);font-size:15px;padding:4px 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:6px 12px;border-radius:99px;background:var(--bg);font-size:14px}
.chips button[aria-pressed="true"]{background:var(--lilac);color:#fff}
.two{display:grid;grid-template-columns:110px 1fr;gap:8px}
/* cycle */
.cycle{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.cycle-top{display:flex;align-items:center;gap:10px}
.season{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;font-size:14px;color:#fff;background:var(--muted);white-space:nowrap}
.season.s-winter{background:var(--winter)}.season.s-spring{background:var(--spring)}.season.s-summer{background:var(--summer)}.season.s-autumn{background:var(--autumn)}
.cycle-sub{font-size:12px;color:var(--muted);min-width:0}
.cycle p{margin:0;font-size:14px}
.cycle .cbtn{padding:9px;border-radius:12px;background:var(--bg);font-size:14px}
.cycle .cbtn.main{background:var(--peach);color:#fff}
.cycle details summary{font-size:13px;color:var(--muted);cursor:pointer;padding:2px 0}
.prow{display:grid;grid-template-columns:1fr 1fr 34px;gap:6px;align-items:end;margin-top:6px}
.prow label{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:2px;min-width:0}
.prow input{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 6px;font-size:13px}
.prow button{height:34px;border-radius:10px;background:var(--bg);color:var(--warn)}
.day.s-winter{background:var(--winter-soft)}
.day .sbar{width:60%;height:3px;border-radius:2px;margin-top:auto;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="views" role="tablist" aria-label="切換檢視">
    <button role="tab" id="tabWeek" aria-selected="true" data-view="week">週卡</button>

<script>
/* bumped by scripts/release.sh; must match version.json on release */
const APP_VERSION='2026.10.24-2141';
const PARTS=[{k:'back',n:'背',sub:'背日',fruit:'grape',fn:'葡萄'},{k:'chest',n:'胸',sub:'胸・肩・三頭',fruit:'berry',fn:'草莓'},{k:'legs',n:'腿',sub:'腿日',fruit:'melon',fn:'西瓜'},{k:'period',n:'經期',sub:'輕重量，想練哪裡就練哪裡',fruit:'peach',fn:'桃子'}];
/* fruits drawn in a 40×40 box centred on 0,0 */
function fruit(t){
  if(t==='bud') return `<path d="M0 -7 Q1 -12 3 -13" stroke="#7A5230" stroke-width="1.8" fill="none" stroke-linecap="round"/><ellipse cx="6" cy="-11" rx="5" ry="2.4" fill="#8CCB7A" transform="rotate(-20 6 -11)"/>
    <circle cx="0" cy="2" r="8" fill="#C9E8B4" stroke="#86BF72" stroke-width="1.4"/><circle cx="-3" cy="-1" r="2" fill="#fff" opacity=".6"/>`;
  if(t==='plus') return `<circle r="11" fill="none" stroke="#A39DC0" stroke-width="2" stroke-dasharray="4 3"/><path d="M-5 0 H5 M0 -5 V5" stroke="#A39DC0" stroke-width="2.4" stroke-linecap="round"/>`;
  if(t==='cherry') return `<path d="M-6 4 Q-3 -8 3 -15 M6 2 Q4 -8 3 -15" stroke="#4E8A3A" stroke-width="2" fill="none" stroke-linecap="round"/><ellipse cx="9" cy="-14" rx="6" ry="3" fill="#6CC66F" transform="rotate(-20 9 -14)"/>
    <circle cx="-6" cy="7" r="7" fill="#E8304A" stroke="#B51F36" stroke-width="1.3"/><circle cx="7" cy="5" r="7" fill="#E8304A" stroke="#B51F36" stroke-width="1.3"/>
    <circle cx="-8.5" cy="4.5" r="2" fill="#fff" opacity=".6"/><circle cx="4.5" cy="2.5" r="2" fill="#fff" opacity=".6"/>`;
  if(t==='peach') return `<path d="M0 -11 Q1 -16 3 -18" stroke="#7A5230" stroke-width="2" fill="none" stroke-linecap="round"/><ellipse cx="8" cy="-15" rx="6.5" ry="3" fill="#5DBB63" transform="rotate(-25 8 -15)"/>
    <path d="M0 -11 C-15 -15 -19 3 -10 12 C-5 17 5 17 10 12 C19 3 15 -15 0 -11Z" fill="#FFB08A" stroke="#E58460" stroke-width="1.3"/>
    <path d="M0 -10 Q-5 2 0 15" stroke="#E58460" stroke-width="1.3" fill="none" opacity=".7"/><ellipse cx="-7" cy="1" rx="5" ry="7" fill="#FF7F96" opacity=".35"/>`;
  if(t==='grape') return `<path d="M0 -13 Q1 -18 4 -20" stroke="#7A5230" stroke-width="2" fill="none" stroke-linecap="round"/><ellipse cx="7" cy="-16" rx="6" ry="3" fill="#5DBB63" transform="rotate(-20 7 -16)"/>
    <g fill="#9461E0" stroke="#6C3FB8" stroke-width="1.2">${[[-8,-7],[0,-8],[8,-7],[-4,1],[4,1],[0,9]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="5.6"/>`).join('')}</g>
    <g fill="#fff" opacity=".55">${[[-9,-9],[-1,-10],[7,-9],[-5,-1],[3,-1],[-1,7]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="1.4"/>`).join('')}</g>`;
  if(t==='berry') return `<path d="M0 17 C-15 7 -17 -7 -9 -10 C-4 -12 4 -12 9 -10 C17 -7 15 7 0 17Z" fill="#EF4E5B" stroke="#C7323F" stroke-width="1.2"/>
    <g fill="#FFE08A">${[[-7,-3],[0,-4],[7,-3],[-4,4],[4,4],[0,10]].map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="1.1" ry="1.6"/>`).join('')}</g>
    <path d="M-9 -11 L-3 -10 L0 -16 L3 -10 L9 -11 L4 -7 L0 -9 L-4 -7Z" fill="#4CAF50" stroke="#388E3C" stroke-width="1" stroke-linejoin="round"/>`;
  if(t==='melon') return `<path d="M-17 -6 A17 17 0 0 0 17 -6Z" fill="#3DAA5C"/><path d="M-14 -6 A14 14 0 0 0 14 -6Z" fill="#F4F8E8"/><path d="M-12 -6 A12 12 0 0 0 12 -6Z" fill="#F0505F"/>
    <g fill="#2A2540">${[[-6,-1],[0,3],[6,-1]].map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="1.2" ry="1.9"/>`).join('')}</g>`;
  return `<path d="M-16 -8 C-11 10 11 13 17 -5 C11 4 -6 4 -16 -8Z" fill="#F7D046" stroke="#D9A520" stroke-width="1.4" stroke-linejoin="round"/><path d="M-16 -8 l-2 -3" stroke="#7A5230" stroke-width="2.4" stroke-linecap="round"/><circle cx="17" cy="-5" r="1.4" fill="#7A5230"/>`;
}
const icon=(t,label)=>`<svg viewBox="-20 -20 40 40" ${label?`role="img" aria-label="${label}"`:'aria-hidden="true"'}>${fruit(t)}</svg>`;
const $=s=>document.querySelector(s);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x}
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const md=d=>`${d.getMonth()+1}/${d.getDate()}`;
const todayMD=()=>md(new Date());
const parseKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};

let menus=null, wk=keyOf(monday(new Date())), week=null, mtab='back', mdraft=null, lastCount=-1;

/* storage: this device's browser */
const local={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* planAt／departAt are ISO times: when she decided to go, and when she actually left */
function blankLift(p){return{done:false,date:'',pre:null,post:null,planAt:null,departAt:null,warm:false,cool:false,items:[]}}
const blankClimb=()=>({done:false,date:'',pre:null,post:null,planAt:null,departAt:null,warm:false,main:false,cool:false});
function blankWeek(){const lifts={};PARTS.forEach(p=>lifts[p.k]=blankLift());return{lifts,climbs:[blankClimb(),blankClimb(),blankClimb()],extras:[]}}
/* menu rows are uniform {name,sets:n,reps,kg} (older ones kept sets as text like "4組" in `detail`) */
function normItem(m){const sets=Number.isFinite(m.sets)?m.sets:(parseInt(m.detail)||3);return{name:m.name||'',sets,reps:m.reps??'',kg:m.kg??''}}
/* a session's exercise holds one row per set: {name, sets:[{reps,kg,ok}]} */
function expand(m,ok=false){const d=normItem(m);return{name:d.name,sets:Array.from({length:d.sets},()=>({reps:String(d.reps),kg:String(d.kg),ok}))}}
function normExercise(it){if(Array.isArray(it.sets))return{name:it.name||'',sets:it.sets.map(x=>({reps:String(x.reps??''),kg:String(x.kg??''),ok:!!x.ok}))};return expand(it,!!it.ok)}
function itemsFromMenu(p,old){const prev={};(old||[]).forEach(i=>prev[i.name]=i);return (menus?.[p]||[]).map(m=>prev[m.name]||expand(m))}
const exDone=it=>it.sets.length>0&&it.sets.every(x=>x.ok);
function normalize(w){
  const b=blankWeek(); w=w?clone(w):b;
  w.lifts=w.lifts||b.lifts; PARTS.forEach(p=>{const l=Object.assign(blankLift(),w.lifts[p.k]||{});l.items=l.items.map(normExercise);w.lifts[p.k]=l});
  w.extras=Array.isArray(w.extras)?w.extras:[];
  w.climbs=(w.climbs&&w.climbs.length===3)?w.climbs.map(c=>Object.assign(blankClimb(),c)):b.climbs; return w;
}
function fillEmptyLifts(){PARTS.forEach(p=>{const l=week.lifts[p.k];if(!l.done&&l.items.length===0)l.items=itemsFromMenu(p.k)})}

/* save queue: one write at a time, coalesced */
let saving=false, dirty=false, timer=null;
function queueSave(){dirty=true;clearTimeout(timer);timer=setTimeout(flush,500)}
async function flush(){
  clearTimeout(timer); if(saving||!dirty) return;
  saving=true; dirty=false; const key=wk, data=clone(week);
  local.set('week:'+key,data); allWeeks[key]=data;
  saving=false; if(dirty) flush();
}

function loadWeek(){
  week=normalize(local.get('week:'+wk)); fillEmptyLifts(); render();
}

let pendingRender=false;
let sel=null;   // {i,j}: the picked fruit (j=-1 means the branch itself)
const WC={warm:['暖身','5–10 分鐘動態伸展＋輕重量'],cool:['收操','伸展 5–10 分鐘，放鬆練到的部位']};
document.addEventListener('focusout',()=>{if(pendingRender){pendingRender=false;setTimeout(render,0)}});

/* ---------- cycle (四季分法) ---------- */
let cycle={periods:[]};
const SEASONS={
  winter:{n:'冬',e:'❄️',ph:'月經期',tip:'降低重量、不排高強度。今天可以選🍑經期日，練輕的就好；想休息就休息，多喝溫水。'},
  spring:{n:'春',e:'🌱',ph:'濾泡期',tip:'精力回升，適合試新動作或稍微加一點重量。'},
  summer:{n:'夏',e:'☀️',ph:'排卵期',tip:'精力最高峰。狀態好、想挑戰重量，就是這幾天。'},
  autumn:{n:'秋',e:'🍂',ph:'黃體期',tip:'精力開始下降，維持重量就好。情緒起伏是荷爾蒙的關係，不是你的問題。'}};
const DAY=864e5, dayDiff=(a,b)=>Math.round((parseKey(keyOf(a))-parseKey(keyOf(b)))/DAY);
function cycleStats(){
  const ps=cycle.periods.filter(x=>x.start).sort((a,b)=>a.start<b.start?-1:1);
  const gaps=[];for(let i=1;i<ps.length;i++)gaps.push(dayDiff(parseKey(ps[i].start),parseKey(ps[i-1].start)));
  const g=gaps.slice(-3).filter(x=>x>=21&&x<=40);
  const lens=ps.filter(x=>x.end).map(x=>dayDiff(parseKey(x.end),parseKey(x.start))+1).filter(x=>x>=2&&x<=10).slice(-3);
  return{ps,len:g.length?Math.round(g.reduce((a,b)=>a+b)/g.length):28,plen:lens.length?Math.round(lens.reduce((a,b)=>a+b)/lens.length):5};
}
function phaseOn(d){
  const {ps,len,plen}=cycleStats(); const k=keyOf(d);
  const cur=[...ps].reverse().find(x=>x.start<=k); if(!cur) return null;
  const day=dayDiff(d,parseKey(cur.start))+1;
  if(day>len+20) return null;
  /* no end date yet: treat it as ongoing for a few days past the usual length, then assume the usual length */
  const open=!cur.end&&dayDiff(new Date(),parseKey(cur.start))+1<=plen+3;
  const inPeriod=cur.end?k<=cur.end:(open?k<=keyOf(new Date()):day<=plen);
  const ov=len-14; let season;
  if(inPeriod) season='winter'; else if(day<ov-1) season='spring'; else if(day<=ov+1) season='summer'; else season='autumn';
  return{season,day,len,open:open&&inPeriod,late:season==='autumn'&&day>len,next:(()=>{const n=parseKey(cur.start);n.setDate(n.getDate()+len);return n})()};
}
function saveCycle(){cycle.periods.sort((a,b)=>a.start<b.start?-1:1);local.set('cycle',cycle)}
function renderCycle(){
  const today=new Date(), ph=phaseOn(today), S=ph&&SEASONS[ph.season];
  const head=S?`<div class="cycle-top"><span class="season s-${ph.season}">${S.e} ${S.n}・${S.ph}</span>
      <span class="cycle-sub">${ph.season==='winter'?`經期第 ${ph.day} 天`:`週期第 ${ph.day} 天 · 預計下次 ${md(ph.next)}`}</span></div>
      <p>${ph.late?'比預計晚了幾天，月經來了的話記得按下面的按鈕。':S.tip}</p>`
    :`<div class="cycle-top"><span class="season">週期</span><span class="cycle-sub">還沒有紀錄</span></div>
      <p>月經來的那天按下面的按鈕，app 會幫你推算現在是春、夏、秋還是冬。</p>`;
  const btn=ph&&ph.open?`<button class="cbtn" data-act="pend">月經今天結束了</button>`:`<button class="cbtn main" data-act="pstart">月經今天來了</button>`;
  const rows=[...cycle.periods].map((x,i)=>({x,i})).reverse().map(({x,i})=>`<div class="prow">
      <label>開始<input type="date" id="ps-${i}" data-pi="${i}" data-pf="start" value="${x.start||''}"></label>
      <label>結束<input type="date" id="pe-${i}" data-pi="${i}" data-pf="end" value="${x.end||''}"></label>
      <button data-act="pdel" data-i="${i}" aria-label="刪除這筆月經紀錄">✕</button></div>`).join('');
  $('#cycle').innerHTML=`${head}${btn}<details id="pdet"${pdetOpen?' open':''}><summary>編輯月經紀錄（${cycle.periods.length} 筆）</summary>${rows}
    <button class="cbtn" style="width:100%;margin-top:8px" data-act="padd">＋ 補一筆過去的紀錄</button></details>`;
}
let pdetOpen=false;
document.addEventListener('toggle',e=>{if(e.target.id==='pdet')pdetOpen=e.target.open},true);
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.pi==null)return;const x=cycle.periods[+t.dataset.pi];if(!x)return;
  x[t.dataset.pf]=t.value||(t.dataset.pf==='end'?null:x.start);saveCycle();render()});

/* ---------- render ---------- */
/* a week holds 3 lift fruits; a 經期 session can stand in for any of them */
const liftsDone=w=>PARTS.filter(p=>w.lifts[p.k].done);
/* each extra session stands in for one missing session */
const weekTotal=w=>Math.min(6,Math.min(3,liftsDone(w).length)+w.climbs.filter(c=>c.done).length+(w.extras||[]).length);
function count(){if(!week)return 0;return weekTotal(week)}
const WINTER_MSG=['冬天來了，好好休息也是訓練的一部分','冬天還有去，這顆很珍貴','有去就很棒，記得多喝溫水','練輕一點也算數，累了就回家','身體在辛苦的時候你還在動，很了不起','差一點點，但休息比裝滿籃子重要','冬天也裝滿了，記得好好犒賞自己'];
function message(n){
  const ph=wk===keyOf(monday(new Date()))?phaseOn(new Date()):null;
  if(ph&&ph.season==='winter') return WINTER_MSG[n];
  return ['新的一週，籃子空空的，去摘水果吧','第一顆水果！有去就贏一半','兩顆了，籃子開始有重量','一半了，照這個節奏就好','四顆！今天也可以只是去動一動','只差一顆就裝滿了','整籃裝滿，豐收的一週！'][n];
}
function renderHero(){
  const s=week?week:blankWeek();
  const back=[{x:72,y:68},{x:120,y:62},{x:168,y:70}], front=[{x:84,y:96},{x:124,y:100},{x:162,y:96}];
  const placed=[...liftsDone(s).slice(0,3).map((p,i)=>({t:p.fruit,...back[i]})),...s.climbs.map((c,i)=>c.done?{t:'banana',...front[i]}:null).filter(Boolean)];
  const free=[...front.filter((_,i)=>!s.climbs[i].done),...back.slice(Math.min(3,liftsDone(s).length))];
  (s.extras||[]).slice(0,free.length).forEach((x,i)=>placed.push({t:'cherry',...free[i]}));
  $('#spots').innerHTML=placed.map(f=>`<g transform="translate(${f.x} ${f.y}) scale(1.35)">${fruit(f.t)}</g>`).join('');
  const n=count(); $('#score').innerHTML=`${n}<small> / 6</small>`; $('#bubble').textContent=message(n);
  if(lastCount>=0&&n>lastCount){const g=$('#gecko');g.classList.remove('wiggle');void g.offsetWidth;g.classList.add('wiggle')}
  lastCount=n;
}
function renderNav(){
  const m=parseKey(wk), e=new Date(m); e.setDate(m.getDate()+6);
  $('#range').textContent=`${md(m)} – ${md(e)}`;
  const cur=keyOf(monday(new Date())), t=$('#tag');
  t.textContent= wk===cur?'本週':(wk<cur?'過去的週':'未來的週'); t.className='tag'+(wk===cur?' now':'');
}
function stepper(f,label,val){
  return `<div class="step"><label>${label}</label><div class="row">
    <button class="pm" data-act="pain" data-f="${f}" data-d="-1" aria-label="${label}減一">−</button>
    <output>${val==null?'–':val}</output>

}

  ids.forEach(id=>{
    const w=normalize(weekWithLive(id)), m=parseKey(id), days={};
    for(let i=0;i<7;i++){const d=new Date(m);d.setDate(m.getDate()+i);days[md(d)]=keyOf(d)}
    const push=(date,e)=>{const k=days[date];if(k)(ev[k]=ev[k]||[]).push(e)};
    PARTS.forEach(p=>{const l=w.lifts[p.k];if(l.done)push(l.date,{t:'l',n:p.n,f:p.fruit})});
    w.climbs.forEach(c=>{if(c.done)push(c.date,{t:'c'})});
    w.extras.forEach(x=>push(x.date,{t:'x',n:x.type}));
  });
  return ev;
}
function weekCount(id){const w=weekWithLive(id);if(!w)return 0;return weekTotal(normalize(w))}
function renderMonth(){
  const y=mcur.getFullYear(), mo=mcur.getMonth(), now=new Date();
  $('#mrange').textContent=`${y} 年 ${mo+1} 月`;
  const isCur=y===now.getFullYear()&&mo===now.getMonth();
  $('#mtag').textContent=isCur?'本月':' '; $('#mtag').className='tag'+(isCur?' now':'');
  const ev=eventsByDay(), todayK=keyOf(now);
  let start=monday(mcur), rows='', lifts=0, climbs=0, extras=0, full=0, pre=[], post=[], lag=[];
  const last=new Date(y,mo+1,0);
  while(start<=last){
    const wid=keyOf(start); let cells='';
    for(let i=0;i<7;i++){
      const d=new Date(start);d.setDate(start.getDate()+i);const k=keyOf(d),inM=d.getMonth()===mo,e=ev[k]||[];
      if(inM){lifts+=e.filter(x=>x.t==='l').length;climbs+=e.filter(x=>x.t==='c').length;extras+=e.filter(x=>x.t==='x').length}
      const label=`${d.getMonth()+1}月${d.getDate()}日${e.length?'，'+e.map(x=>x.t==='l'?x.n+'日':x.t==='x'?x.n:'有氧').join('、'):''}`;
      const ph=phaseOn(d), sc=ph?ph.season:'';
      cells+=`<button class="day${inM?'':' out'}${k===todayK?' today':''}${sc==='winter'?' s-winter':''}" data-goto="${wid}" aria-label="${label}${ph?'，'+SEASONS[sc].n+'季':''}">
        <span class="dn">${d.getDate()}</span><span class="ev">${e.slice(0,2).map(x=>icon(x.t==='l'?x.f:x.t==='x'?'cherry':'banana')).join('')}${e.length>2?`<span class="more">+${e.length-2}</span>`:''}</span>${sc?`<span class="sbar" style="background:var(--${sc})"></span>`:''}</button>`;
    }
    const n=weekCount(wid);
    if(start.getMonth()===mo){ if(n===6)full++; const w=weekWithLive(wid); if(w)collect(normalize(w),pre,post,lag); }
    rows+=`<div class="wrow">${cells}<span class="wsum${n===6?' full':''}" aria-label="這週完成 ${n} 次">${n}/6</span></div>`;
    start=new Date(start);start.setDate(start.getDate()+7);
  }
  $('#grid').innerHTML=rows;
  $('#mstats').innerHTML=`<div class="stat"><span>重訓</span><b>${lifts}</b></div><div class="stat"><span>有氧</span><b>${climbs}</b></div><div class="stat"><span>額外</span><b>${extras}</b></div><div class="stat"><span>全滿的週</span><b>${full}</b></div>
    <div class="stat"><span>預估痛苦</span><b>${avg(pre)}</b></div><div class="stat"><span>實際痛苦</span><b>${avg(post)}</b></div><div class="stat"><span>多想了</span><b>${gap(pre,post)}</b></div><div class="stat"><span>平均拖了</span><b style="font-size:15px">${lagTxt(lag)}</b></div>`;
}
function setView(v){view=v;$('#weekView').hidden=v!=='week';$('#monthView').hidden=v!=='month';
  $('#tabWeek').setAttribute('aria-selected',v==='week');$('#tabMonth').setAttribute('aria-selected',v==='month');
  if(v==='month')renderMonth()}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',async()=>{if(b.dataset.view==='month'){await flush()}setView(b.dataset.view)}));
$('#mprev').addEventListener('click',()=>{mcur=new Date(mcur.getFullYear(),mcur.getMonth()-1,1);renderMonth()});
$('#mnext').addEventListener('click',()=>{mcur=new Date(mcur.getFullYear(),mcur.getMonth()+1,1);renderMonth()});
$('#grid').addEventListener('click',e=>{const b=e.target.closest('[data-goto]');if(!b)return;const id=b.dataset.goto;setView('week');if(id!==wk){wk=id;lastCount=-1;loadWeek()}});
function loadAllLocal(){allWeeks={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('week:'))allWeeks[k.slice(5)]=local.get(k)}}catch(e){}}

/* ---------- backup ---------- */
const STARTER_MENUS={"back": [{"kg": "", "name": "滑輪下拉", "reps": "", "sets": 4}, {"kg": "", "name": "單手下拉", "reps": "", "sets": 4}, {"kg": "", "name": "划船", "reps": "", "sets": 4}, {"kg": "", "name": "面拉", "reps": "", "sets": 4}, {"kg": "", "name": "引體向上（彈力帶）", "reps": "", "sets": 3}], "chest": [{"kg": "", "name": "胸推（範例）", "reps": "", "sets": 3}, {"kg": "", "name": "肩推（範例）", "reps": "", "sets": 3}, {"kg": "", "name": "三頭下壓（範例）", "reps": "", "sets": 3}], "legs": [{"kg": "", "name": "硬舉", "reps": "", "sets": 3}, {"kg": "", "name": "背槓深蹲", "reps": "", "sets": 3}, {"kg": "", "name": "腿推（雙腿＋單腿）", "reps": "", "sets": 3}, {"kg": "", "name": "分腿蹲", "reps": "", "sets": 3}, {"kg": "", "name": "腿後勾", "reps": "", "sets": 4}], "period": [{"kg": "", "name": "腿推（輕重量）", "reps": "", "sets": 2}, {"kg": "", "name": "滑輪下拉（輕重量）", "reps": "", "sets": 2}, {"kg": "", "name": "伸展／瑜珈", "reps": "", "sets": 1}]};
function backupData(){loadAllLocal();if(week)allWeeks[wk]=week;return{app:'fruit-basket',version:1,exportedAt:new Date().toISOString(),menus,weeks:allWeeks,cycle}}
$('#exportBtn').addEventListener('click',async()=>{
  await flush();
  const blob=new Blob([JSON.stringify(backupData(),null,1)],{type:'application/json'});
  const name=`水果籃備份-${keyOf(new Date())}.json`;
  const file=new File([blob],name,{type:'application/json'});
  try{ if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:name});return} }catch(e){ if(e.name==='AbortError')return }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
});
$('#importBtn').addEventListener('click',()=>$('#importFile').click());
$('#importFile').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(d.app!=='fruit-basket'||!d.weeks)throw new Error('format');
    if(d.menus){menus=d.menus;if(!menus.period)menus.period=STARTER_MENUS.period;local.set('menus',menus);mdraft=null}
    if(d.cycle&&Array.isArray(d.cycle.periods)){cycle=d.cycle;saveCycle()}
    const ks=Object.keys(d.weeks);ks.forEach(k=>local.set('week:'+k,d.weeks[k]));
    loadAllLocal();loadWeek();toast(`匯入了 ${ks.length} 週的紀錄`);
  }catch(err){toast('這個檔案不是水果籃的備份，請選匯出的 .json 檔')}
});

/* ---------- update check ---------- */
let latest=null;
async function checkUpdate(){
  try{
    const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) return;
    const j=await r.json();
    if(j.version&&j.version!==APP_VERSION){latest=j.version;$('#updateText').textContent=j.notes?`有新版本：${j.notes}`:'有新版本';$('#updateBar').hidden=false}
  }catch(e){}
}
$('#updateBtn').addEventListener('click',async()=>{await flush();location.replace('./?v='+encodeURIComponent(latest||Date.now()))});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
setInterval(checkUpdate,30*60*1000);
checkUpdate();

/* ---------- boot ---------- */
{const lg=[...PARTS.map(p=>`<span>${icon(p.fruit)}${p.n}</span>`),`<span>${icon('banana')}有氧</span>`,`<span>${icon('cherry')}額外</span>`].join('');$('#legend').innerHTML=lg;
 $('#mlegend').innerHTML=lg+Object.entries(SEASONS).map(([k,v])=>`<span><i style="display:inline-block;width:12px;height:3px;border-radius:2px;background:var(--${k})"></i>${v.n}</span>`).join('')}
render();
(()=>{
  try{ navigator.storage?.persist?.() }catch(e){}
  loadAllLocal();
  menus=local.get('menus')||STARTER_MENUS; if(!menus.period)menus.period=STARTER_MENUS.period;
  cycle=local.get('cycle')||{periods:[]};
  loadWeek();
})();
</script>
