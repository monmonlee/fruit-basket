<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<meta name="description" content="每週重訓加有氧的打卡卡片，每打卡一次就在籃子裡多放一顆水果。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="水果籃">
<meta property="og:title" content="水果籃運動週卡">
<meta property="og:description" content="每週重訓加有氧的打卡卡片，練完一次，籃子就多一顆水果。">
<meta property="og:url" content="https://monmonlee.github.io/fruit-basket/">
<meta property="og:image" content="https://monmonlee.github.io/fruit-basket/icons/og-image.png?v=3">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="icons/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="水果籃">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" id="tcLight" content="#F2F7F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" id="tcDark" content="#132019" media="(prefers-color-scheme: dark)">
<script>try{const t=JSON.parse(localStorage.getItem('theme'));if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one narrow phone column. The basket is the start button: unpicked fruit float above it as ghosts; every session opens the same bottom sheet. */
:root{
  /* 晨間果園: one primary green for actions; season/status colours only on outlines and labels */
  --bg:#F2F7F1; --card:#FFFFFF; --ink:#1E2B22; --muted:#5C6E62; --line:#D6E4D6;
  --primary:#2F7D5B; --primary-soft:#E0EFE5; --on-primary:#FFFFFF;
  --warn:#C24E2E;
  --winter:#3D74C4; --spring:#2E8A4E; --summer:#A9701A; --autumn:#B9552D; --peach:#C8613F; --winter-soft:#E2ECF8;
  --basket:#E3B27A; --basket-line:#A8743A; --basket-in:#C99256;
  --font:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --num:"Fredoka","Huninn","PingFang TC",sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#132019; --card:#1B2A21; --ink:#E7F0E9; --muted:#9DB2A4; --line:#2B3D31;
  --primary:#6CCB9A; --primary-soft:#21392B; --on-primary:#0F2418;
  --warn:#F08A68;
  --winter:#8DB4F0; --spring:#7FD39A; --summer:#E9B85A; --autumn:#F0976E; --peach:#F2A07F; --winter-soft:#1E2C3E;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#132019; --card:#1B2A21; --ink:#E7F0E9; --muted:#9DB2A4; --line:#2B3D31;
  --primary:#6CCB9A; --primary-soft:#21392B; --on-primary:#0F2418;
  --warn:#F08A68;
  --winter:#8DB4F0; --spring:#7FD39A; --summer:#E9B85A; --autumn:#F0976E; --peach:#F2A07F; --winter-soft:#1E2C3E;
  color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
[hidden]{display:none!important}
html,body{margin:0;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:10px}

/* week nav */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weeknav button{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-family:var(--num);font-size:20px;line-height:1}
.weeknav .mid{text-align:center}
.weeknav .range{font-family:var(--num);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.weeknav .tag{font-size:12px;color:var(--muted);letter-spacing:.08em}
.weeknav .tag.now{color:var(--primary)}

/* hero */
.hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0 4px}
.hero svg{width:100%;max-width:300px;height:auto;display:block}
.score{font-family:var(--num);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:20px;color:var(--muted);font-weight:500}
.bubble{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:16px;padding:6px 14px;font-size:15px;text-align:center;text-wrap:balance}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:3px}
.legend svg{width:18px;height:18px}
.wiggle{animation:wig .6s ease}
@keyframes wig{0%,100%{transform:rotate(0)}30%{transform:rotate(-4deg)}60%{transform:rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.wiggle{animation:none}}

/* sections */
h2{font-size:18px;font-weight:400;margin:0;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h2 span{font-size:12px;color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:10px}
.tip{font-size:13px;color:var(--muted);margin:0}

/* basket as the start button */
.hero-head{align-self:stretch;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hero-head b{font-weight:400;font-size:18px}
.hero-head span{font-size:12px;color:var(--muted)}
.orchard{position:relative;width:100%;max-width:400px;aspect-ratio:1/.95;margin:0 auto}
.orchard #gecko{position:absolute;left:8%;bottom:0;width:84%;max-width:none}
#gecko [data-act]{cursor:pointer}
.seed{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:68px;padding:0}
.seed .gb{width:56px;height:56px;border-radius:50%;border:2px dashed var(--muted);background:var(--card);display:grid;place-items:center;animation:bob 3.2s ease-in-out infinite}
.seed:nth-child(2n) .gb{animation-delay:-1.6s}
.seed svg{width:38px;height:38px;opacity:.7;transition:opacity .15s}
.seed small{font-size:12px;color:var(--muted);white-space:nowrap;line-height:1.3;margin-top:2px}
.seed:hover svg,.seed:focus-visible svg{opacity:.9}
.seed.going .gb{border:2px solid var(--primary);animation:pulse 1.6s ease-in-out infinite}
.seed.going svg{opacity:.95}
.seed.going small{color:var(--primary)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,139,110,.55)}50%{box-shadow:0 0 0 9px rgba(240,139,110,0)}}
@media (prefers-reduced-motion:reduce){.seed .gb{animation:none}}

/* bottom sheet: the one place every session is logged */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end}
.backdrop{position:absolute;inset:0;background:rgba(20,16,40,.45);border:0;width:100%}
.sheet{position:relative;background:var(--bg);border-radius:24px 24px 0 0;max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;width:100%;max-width:520px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.2);animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
.sheet header{display:flex;align-items:center;gap:10px;padding:8px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));flex:none}
.sheet header svg{width:38px;height:38px;flex:none}
.sheet header h3{margin:0;font-size:18px;font-weight:400;flex:1;min-width:0}
.sheet header h3 small{display:block;font-size:12px;color:var(--muted)}
.xbtn{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:15px;flex:none}
.sheet-body{overflow-y:auto;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.stage{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.stage h4{margin:0;font-size:14px;font-weight:400;display:flex;align-items:center;gap:8px}
.stage h4 i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-family:var(--num);font-weight:600;font-size:13px}
.stage.cur{border-color:var(--primary)}
.stage.cur h4 i{background:var(--primary);color:var(--on-primary)}
.timeline{margin:0;font-size:13px;color:var(--muted)}
.timeline b{color:var(--ink);font-weight:400}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.go-btn{padding:12px;border-radius:14px;background:var(--primary);color:var(--on-primary);font-size:16px}
.ghost{padding:10px;border-radius:12px;background:var(--bg);font-size:14px}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.item{display:flex;flex-direction:column;gap:8px;padding:8px 10px;border-radius:12px;background:var(--bg)}
.item.ok{background:var(--primary-soft)}
.irow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.irow .nm{text-align:left;padding:0}
.ed{font-size:12px;color:var(--primary);white-space:nowrap}
.item.wc .nm span{color:var(--muted)}
.iedit{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:4px;border-top:1px dashed var(--line)}
.iedit .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld label{font-size:12px;color:var(--muted)}
.fld input{width:100%;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 9px;font-size:14px}
.fld .row{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.fld .row button{width:30px;height:30px;border-radius:8px;background:var(--bg);font-family:var(--num);font-size:17px;line-height:1}
.fld .row output{font-family:var(--num);font-weight:600;font-size:17px}
.idel{grid-column:1/-1;justify-self:start;font-size:13px;color:var(--warn);padding:4px 0}
.addone{padding:9px;border-radius:12px;border:1.5px dashed var(--line);color:var(--muted);font-size:14px}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--on-primary);font-size:15px}
.item.ok .check{background:var(--primary);border-color:var(--primary)}
.item .nm{min-width:0}
.item .nm b{font-weight:400;display:block;overflow-wrap:anywhere}
.item .nm span{font-size:12px;color:var(--muted)}
.kg{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 8px;font-family:var(--num);font-size:14px;text-align:center}
.empty{font-size:13px;color:var(--muted);background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.pain{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.step{background:var(--bg);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;align-items:center}
.step label{font-size:12px;color:var(--muted)}
.step .row{display:flex;align-items:center;gap:10px}
.step button.pm{width:30px;height:30px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-family:var(--num);font-size:18px;line-height:1}
.step output{font-family:var(--num);font-weight:600;font-size:20px;min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.stamp-btn{width:100%;padding:12px;border-radius:14px;background:var(--primary);color:var(--on-primary);font-size:16px}
.stamp-btn.quiet{background:var(--primary-soft);color:var(--primary)}
.stamp-btn.undo{background:var(--bg);color:var(--muted)}

/* menu editor */
details.menu{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 0}
details.menu summary{padding:10px 0;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.menu summary::-webkit-details-marker{display:none}
details.menu summary span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:8px;border-radius:12px;background:var(--bg);color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--primary-soft);color:var(--primary)}
.mrows{display:flex;flex-direction:column;gap:6px}
.mrow{display:grid;grid-template-columns:1fr 1fr 1fr 34px;gap:6px;padding:8px;border-radius:12px;background:var(--bg)}
.mrow .mname{grid-column:1/4}
.mrow input{width:100%;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 9px;font-size:14px}
.mrow button{border-radius:10px;background:var(--card);color:var(--warn);font-size:16px}
.mrow small{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.mactions{display:flex;gap:8px;padding:10px 0 12px}
.mactions button{flex:1;padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.mactions .save{background:var(--primary);color:var(--on-primary)}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.stat{padding:4px 0}
.stat span{font-size:12px;color:var(--muted);display:block}
.stat b{font-family:var(--num);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);text-align:center}
.app .app{max-width:none;margin:0;width:100%}

/* weekly goal setup */
.goalrow{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.goalrow:last-child{border-bottom:0}
.goalrow svg{width:34px;height:34px}
.goalrow input{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 9px;font-size:15px}
.goalrow b{font-weight:400;display:block}
.goalrow small{font-size:12px;color:var(--muted);display:block}
.sw{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--primary)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.cnt{display:flex;align-items:center;gap:8px}
.cnt button{width:32px;height:32px;border-radius:50%;background:var(--bg);border:1px solid var(--line);font-family:var(--num);font-size:18px;line-height:1}
.cnt output{font-family:var(--num);font-weight:600;font-size:18px;min-width:20px;text-align:center}
.goalsum{text-align:center;font-size:15px;padding:4px 0}
.goalsum b{font-family:var(--num);font-size:26px;color:var(--primary)}
.intro{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.intro li{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center}
.intro svg{width:42px;height:42px}
.pickone{display:flex;flex-direction:column;gap:8px}
.pickone button{text-align:left;padding:12px;border-radius:14px;background:var(--card);border:1.5px solid var(--line)}
.pickone button[aria-checked="true"]{border-color:var(--primary);background:var(--primary-soft)}
.pickone small{display:block;color:var(--muted);font-size:13px}
.steps{display:flex;justify-content:center;gap:6px}
.steps i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.steps i.on{background:var(--primary);width:20px;border-radius:4px}
/* jam shelf: one jar per month */
.shelf{display:flex;gap:14px;overflow-x:auto;padding:6px 2px 0;scroll-snap-type:x proximity}
.shelf::after{content:"";flex:0 0 1px}
.jar{flex:0 0 74px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0;scroll-snap-align:end}
.jar svg{width:70px;height:92px;overflow:visible}
.jar small{font-size:12px;color:var(--muted);text-align:center;line-height:1.3}
.jar.cur small{color:var(--primary)}
.board{height:8px;border-radius:4px;background:var(--basket);margin-top:-2px;box-shadow:0 3px 0 var(--basket-line)}
.jarcard{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center}
.jarcard svg{width:52px;height:68px}
/* effects */
.spark{position:fixed;width:24px;height:24px;margin:-12px 0 0 -12px;pointer-events:none;z-index:60;animation:spark var(--t,.9s) cubic-bezier(.2,.7,.3,1) forwards}
.spark.dot{width:9px;height:9px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--c)}
.spark svg{width:100%;height:100%}
@keyframes spark{0%{transform:translate(0,0) scale(.4);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1);opacity:0}}
.dropin{animation:dropin .55s cubic-bezier(.3,1.4,.5,1) both;transform-box:fill-box;transform-origin:center}
@keyframes dropin{0%{transform:translateY(-70px) scale(.7);opacity:0}60%{opacity:1}100%{transform:none}}
.fr.pop svg{animation:popf .35s ease}
@keyframes popf{50%{transform:scale(1.35)}}
@media (prefers-reduced-motion:reduce){.spark,.dropin,.fr.pop svg{animation:none}.spark{display:none}}
/* "I really don't want to work out" decision cards */
.meh{font-size:14px;color:var(--muted);padding:6px 14px;border-radius:99px;border:1px dashed var(--muted)}
.deck{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.deck-top{width:100%;max-width:440px;display:flex;justify-content:space-between;align-items:center;min-height:40px}
.deck-top .back{font-size:14px;color:var(--muted);padding:8px 4px}
.dcard{width:100%;max-width:440px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;animation:dslide .32s cubic-bezier(.2,.8,.3,1)}
@keyframes dslide{from{transform:translateX(40px);opacity:0}}
.dcard.backward{animation-name:dslideb}
@keyframes dslideb{from{transform:translateX(-40px);opacity:0}}
.dcard .face{width:150px;height:150px}
.dcard h3{margin:0;font-size:24px;font-weight:400;text-wrap:balance}
.dcard p{margin:0;color:var(--muted);font-size:15px;max-width:30ch;text-wrap:balance}
.dcard .qno{font-family:var(--num);font-size:13px;color:var(--primary);letter-spacing:.1em}
.answers{width:100%;display:grid;gap:10px;margin-top:6px}
.answers button{padding:14px;border-radius:16px;font-size:16px;background:var(--card);border:1.5px solid var(--line)}
.answers button.pri{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.drum{font-size:34px;letter-spacing:.1em;min-height:1.4em}
.drum span{display:inline-block;animation:dum .35s ease both}
@keyframes dum{0%{transform:scale(2.2);opacity:0}60%{transform:scale(.9);opacity:1}100%{transform:none}}
.verdict{font-size:34px;color:var(--primary);animation:reveal .6s cubic-bezier(.2,1.6,.4,1) both}
.verdict.rest{color:var(--winter)}
@keyframes reveal{0%{transform:scale(.3) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
.zz{position:fixed;font-family:var(--num);font-size:26px;color:var(--winter);pointer-events:none;z-index:60;animation:zz 2.4s ease-out forwards}
@keyframes zz{0%{transform:translate(0,0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translate(var(--dx),-240px) scale(1.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.dcard,.drum span,.verdict,.zz{animation:none}}
/* appearance */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px;gap:4px}
.seg button{flex:1;padding:8px;border-radius:99px;color:var(--muted);font-size:14px}
.seg button[aria-checked="true"]{background:var(--primary-soft);color:var(--primary)}
/* view tabs */
.views{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px;gap:4px}
.views button{flex:1;padding:8px;border-radius:99px;color:var(--muted)}
.views button[aria-selected="true"]{background:var(--primary-soft);color:var(--primary)}

/* month calendar */
.mstats{display:grid;grid-template-columns:repeat(12,1fr);gap:8px}
.mstats .stat{grid-column:span 3}
.cal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px}
.dow,.wrow{display:grid;grid-template-columns:repeat(7,1fr) 30px;gap:4px}
.dow{font-size:12px;color:var(--muted);text-align:center;margin-bottom:6px}
.dow::after{content:""}
.grid{display:flex;flex-direction:column;gap:4px}
.day{aspect-ratio:1;max-width:100%;border-radius:12px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:4px;gap:2px;min-width:0}
.day.out{opacity:.35}
.day.today{outline:2px solid var(--primary);outline-offset:-2px}
.day .dn{font-family:var(--num);font-size:13px;font-weight:500;line-height:1.2;font-variant-numeric:tabular-nums}
.day .ev{display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
.day .ev{gap:0;flex-wrap:nowrap;align-items:center;max-width:100%}
.day .ev svg{width:15px;height:15px;flex:none}
.day .ev svg+svg{margin-left:-6px}
.day .ev .more{font-family:var(--num);font-size:11px;font-weight:600;color:var(--muted);margin-left:1px}
.wsum{display:grid;place-items:center;font-family:var(--num);font-weight:600;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.wsum.full{color:var(--primary)}
.update{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;
  display:flex;align-items:center;gap:10px;background:var(--primary);color:var(--on-primary);border-radius:99px;padding:8px 8px 8px 16px;
  box-shadow:0 6px 20px rgba(60,40,140,.25);max-width:calc(100% - 32px);font-size:14px}
.update span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.update button{background:var(--on-primary);color:var(--primary);border-radius:99px;padding:6px 14px;font-size:14px;white-space:nowrap}
/* fruit tree: one branch per exercise, one fruit per set */
.wcrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wcbtn{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--bg);font-size:14px;text-align:left}
.wcbtn .check{width:22px;height:22px;font-size:13px;flex:none}
.wcbtn.ok{background:var(--primary-soft)}
.wcbtn.ok .check{background:var(--primary);border-color:var(--primary)}
.tree{position:relative;display:flex;flex-direction:column;gap:14px;padding:22px 0 18px}
.tree::before{content:"";position:absolute;left:81px;top:16px;bottom:10px;width:7px;border-radius:4px;background:var(--basket-line)}
.tree::after{content:"";position:absolute;left:62px;top:0;width:46px;height:28px;border-radius:50%;background:#6CC66F;box-shadow:-14px 6px 0 -4px #5DBB63,14px 6px 0 -4px #5DBB63}
.soil{position:absolute;left:52px;bottom:0;width:66px;height:12px;border-radius:50%;background:var(--basket-in);opacity:.8}
.branch{display:grid;grid-template-columns:72px 1fr;align-items:start;gap:18px;position:relative}
.bname{text-align:right;font-size:13px;line-height:1.25;overflow-wrap:anywhere;padding:6px 0 0}
.bname small{display:block;font-size:12px;color:var(--muted)}
.bname.sel{color:var(--primary)}
.twig{position:relative;display:flex;flex-wrap:wrap;gap:2px 4px;align-items:flex-start;min-width:0}
.twig::before{content:"";position:absolute;left:-12px;right:6px;top:15px;height:3px;border-radius:2px;background:var(--basket-line);opacity:.75}
.fr{position:relative;display:flex;flex-direction:column;align-items:center;width:48px;padding:0;border-radius:12px}
.fr svg{width:32px;height:32px}
.fr small{font-family:var(--num);font-size:12px;color:var(--muted);line-height:1.15;white-space:nowrap;background:var(--card);border-radius:4px;padding:0 2px}
.fr.ripe small{color:var(--ink)}
.fr.sel{background:var(--primary-soft);outline:2px solid var(--primary)}
.fr.plus svg{opacity:.55}
.tree.g-back::before{left:0;top:8px;width:6px}
.tree.g-back::after{left:-4px;right:6px;top:2px;width:auto;height:8px;border-radius:4px;background:var(--basket-line);box-shadow:none}
.tree.g-back .twig::before{background:#6FB45A;opacity:1;height:3px}
.tree.g-back .branch{grid-template-columns:72px 1fr}
.tree.g-chest::before,.tree.g-chest::after,.tree.g-legs::before,.tree.g-legs::after,.tree.g-chest .soil,.tree.g-legs .soil,.tree.g-back .soil{display:none}
.tree.g-chest,.tree.g-legs{padding-top:4px}
.tree.g-chest .twig::before{left:-6px;right:0;top:22px;height:16px;border-radius:8px;background:var(--basket-in);opacity:.55}
.tree.g-legs .twig::before{left:-10px;right:4px;top:14px;height:4px;opacity:1;background:repeating-linear-gradient(90deg,#6FB45A 0 12px,#8CCB7A 12px 15px,#6FB45A 15px 22px)}
.tree.g-legs .twig::after{content:"";position:absolute;left:-6px;right:0;top:26px;height:10px;border-radius:6px;background:var(--basket-in);opacity:.45;z-index:-1}
.tree.g-legs .twig,.tree.g-chest .twig{isolation:isolate}
.tree.g-period::after{background:#F4A9BC;box-shadow:-14px 6px 0 -4px #6CC66F,14px 6px 0 -4px #6CC66F}
.harvest{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.harvest b{font-family:var(--num);color:var(--ink);font-weight:600}
.setedit{background:var(--bg);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.setedit h5{margin:0;font-size:14px;font-weight:400;display:flex;justify-content:space-between;align-items:center}
.setedit .two{grid-template-columns:1fr 1fr}
.setedit .acts{display:flex;flex-wrap:wrap;gap:6px}
.setedit .acts button{padding:7px 10px;border-radius:10px;background:var(--card);font-size:13px}
.setedit .acts .danger{color:var(--warn)}
.ripe-btn{padding:11px;border-radius:12px;background:var(--primary-soft);color:var(--primary);border:1.5px solid var(--primary);font-size:15px}
.ripe-btn.undo{background:var(--card);color:var(--muted)}
/* which day a session counts for */
.dpick{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.dpick > span{font-size:13px;color:var(--muted);margin-right:2px}
.dpick button{padding:6px 12px;border-radius:99px;background:var(--bg);font-size:14px}
.dpick button[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary)}
.dpick input{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 10px;font-size:14px;min-width:0}
.dpick input.on{border-color:var(--primary);background:var(--primary-soft)}
/* backup nudge */
.nudge{background:var(--card);border:1.5px solid var(--warn);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.nudge p{margin:0;font-size:14px}
.nudge .btnrow button{padding:9px;border-radius:12px;font-size:14px;background:var(--bg)}
.nudge .btnrow .main{background:var(--primary);color:var(--on-primary)}
/* extras */
.xlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.xitem{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;background:var(--bg);border-radius:14px;padding:8px 10px}
.xitem svg{width:30px;height:30px}
.xitem b{font-weight:400;display:block}
.xitem span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.xitem button{color:var(--warn);font-size:15px;padding:4px 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:6px 12px;border-radius:99px;background:var(--bg);font-size:14px}
.chips button[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary)}
.two{display:grid;grid-template-columns:110px 1fr;gap:8px}
/* cycle */
.cycle{border-top:1px solid var(--line);padding:16px 0 0;display:flex;flex-direction:column;gap:8px}
.cycle-top{display:flex;align-items:center;gap:10px}
.season{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:99px;font-size:14px;color:var(--muted);border:1.5px solid currentColor;white-space:nowrap}
.season.s-winter{color:var(--winter)}.season.s-spring{color:var(--spring)}.season.s-summer{color:var(--summer)}.season.s-autumn{color:var(--autumn)}
.cycle-sub{font-size:12px;color:var(--muted);min-width:0}
.cycle p{margin:0;font-size:14px}
.cycle .cbtn{padding:9px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px}
.cycle .cbtn.main{background:var(--card);color:var(--peach);border:1.5px solid var(--peach)}
.cycle details summary{font-size:13px;color:var(--muted);cursor:pointer;padding:2px 0}
.prow{display:grid;grid-template-columns:1fr 1fr 34px;gap:6px;align-items:end;margin-top:6px}
.prow label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px;min-width:0}
.prow input{width:100%;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 6px;font-size:13px}
.prow button{height:34px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--warn)}
.day.s-winter{background:var(--winter-soft)}
.day .sbar{width:60%;height:3px;border-radius:2px;margin-top:auto;margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="views" role="tablist" aria-label="切換檢視">
    <button role="tab" id="tabWeek" aria-selected="true" data-view="week">週卡</button>
    <button role="tab" id="tabMonth" aria-selected="false" data-view="month">月曆</button>
    <button role="tab" id="tabSet" aria-selected="false" data-view="settings">設定</button>
  </div>

  <div id="monthView" class="app" hidden>
    <nav class="weeknav" aria-label="切換月份">
      <button id="mprev" aria-label="上個月">‹</button>
      <div class="mid"><div class="range" id="mrange">—</div><div class="tag" id="mtag">本月</div></div>
      <button id="mnext" aria-label="下個月">›</button>
    </nav>
    <div class="mstats" id="mstats"></div>
    <section class="sec">
      <h2>果醬櫃 <span>每個月熬一罐，顏色是那個月練最多的</span></h2>
      <div class="shelf" id="shelf"></div><div class="board" aria-hidden="true"></div>
    </section>
    <div class="cal">
      <div class="dow" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="legend" id="mlegend" style="justify-content:center;flex-wrap:wrap"></div>
    <p class="tip" style="text-align:center">每列右側的數字是那一週的完成數。</p>
    <p class="tip" style="text-align:center">點任何一天，會跳到那一週的週卡。</p>
  </div>

  <div id="weekView" class="app">
  <nav class="weeknav" aria-label="切換週次">
    <button id="prev" aria-label="上一週">‹</button>
    <div class="mid"><div class="range" id="range">—</div><div class="tag" id="tag">本週</div></div>
    <button id="next" aria-label="下一週">›</button>
  </nav>

  <section class="hero">
    <div class="hero-head"><b id="todayTitle">今天要去摘哪一個？</b><span id="todaySub">點半透明的水果開始</span></div>
    <div class="orchard">
    <div id="ghosts"></div>
    <svg id="gecko" viewBox="0 22 240 124" role="img" aria-label="水果籃，每打卡一次就多一顆水果">
      <defs><clipPath id="inBasket"><path d="M0 0 H240 V78 H220 A100 40 0 0 1 20 78 H0 Z"/></clipPath></defs>
      <!-- handles -->
      <g fill="none" stroke="var(--basket-line)" stroke-width="7" stroke-linecap="round">
        <path d="M30 66 C6 54 0 88 24 92"/><path d="M210 66 C234 54 240 88 216 92"/>
      </g>
      <!-- outside wall, seen below the front rim -->
      <path d="M20 78 Q26 132 120 136 Q214 132 220 78 Z" fill="var(--basket)" stroke="var(--basket-line)" stroke-width="3" stroke-linejoin="round"/>
      <g fill="none" stroke="var(--basket-line)" stroke-width="1.8" opacity=".5">
        <path d="M24 94 Q120 136 216 94"/><path d="M32 108 Q120 144 208 108"/><path d="M48 121 Q120 148 192 121"/>
      </g>
      <!-- inside of the basket -->
      <ellipse cx="120" cy="78" rx="100" ry="40" fill="var(--basket-in)"/>
      <g fill="none" stroke="var(--basket-line)" stroke-width="1.6" opacity=".45">
        <ellipse cx="120" cy="84" rx="78" ry="28"/><ellipse cx="120" cy="88" rx="56" ry="19"/><ellipse cx="120" cy="91" rx="32" ry="10"/>
      </g>
      <ellipse cx="120" cy="78" rx="100" ry="40" fill="none" stroke="var(--basket)" stroke-width="9"/>
      <g id="spots" clip-path="url(#inBasket)"></g>
      <!-- front rim drawn over the fruit so it sits inside -->
      <path d="M220 78 A100 40 0 0 1 20 78" fill="none" stroke="var(--basket)" stroke-width="10" stroke-linecap="round"/>
      <path d="M220 78 A100 40 0 0 1 20 78" fill="none" stroke="var(--basket-line)" stroke-width="2" stroke-dasharray="6 4" opacity=".6"/>
    </svg>
    </div>
    <div class="score" id="score" aria-live="polite">0<small> / 6</small></div>
    <div class="bubble" id="bubble">新的一週，去玩吧</div>
    <button class="meh" data-act="deck">今天真的很不想運動…</button>
  </section>

  <div id="nudge" style="display:flex;flex-direction:column;gap:12px"></div>

  <section class="cycle" id="cycle" aria-label="月經週期"></section>

  <section class="sec">
    <h2 id="statsTitle">預估 vs 實際 <span>這週的平均</span></h2>
    <p class="tip" id="statsWhy"></p>
    <div class="stats" id="stats"></div>
  </section>

  </div>

  <div id="setView" class="app" hidden>
  <section class="sec">
    <h2>每週目標 <span id="goalLine"></span></h2>
    <button class="addone" data-act="opensettings">調整每週目標（部位、有氧次數、週期功能）</button>
  </section>

  <details class="menu" id="menu">
    <summary>編輯菜單 <span id="menuParts"></span></summary>
    <div class="tabs" role="tablist" id="mtabs"></div>
    <div class="mrows" id="mrows"></div>
    <div class="mactions"><button id="madd">＋ 加一個動作</button><button class="save" id="msave">儲存菜單</button></div>
  </details>

  <section class="sec">
    <h2>備份 <span>換手機或清除 Safari 資料前記得匯出</span></h2>
    <div class="mactions" style="padding:0">
      <button id="exportBtn">匯出備份</button>
      <button id="importBtn">匯入備份</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </section>

  <section class="sec">
    <h2>外觀 <span>只影響這個 app</span></h2>
    <div class="seg" role="radiogroup" aria-label="外觀" id="themeSeg">
      <button role="radio" data-theme-opt="auto">跟隨手機</button>
      <button role="radio" data-theme-opt="light">淺色</button>
      <button role="radio" data-theme-opt="dark">深色</button>
    </div>
    <div class="goalrow" style="border:0;padding-top:4px"><span></span><div><b>音效</b><small>採收、打卡和裝滿時的小聲音</small></div>
      <button class="sw" role="switch" id="soundSw" aria-label="音效"></button></div>
  </section>

  <p class="note" id="note">讀取中…</p>
  </div>
</div>

<div class="sheet-wrap" id="sheet" hidden>
  <button class="backdrop" data-act="close" aria-label="關閉" tabindex="-1"></button>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grab" aria-hidden="true"></div>
    <header><span id="sheetIcon"></span><h3 id="sheetTitle"></h3><button class="xbtn" id="sheetClose" data-act="close" aria-label="關閉">✕</button></header>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="deck" id="deck" hidden role="dialog" aria-modal="true" aria-label="今天真的很不想運動"></div>

<div class="update" id="updateBar" role="status" hidden>
  <span id="updateText">有新版本</span>
  <button id="updateBtn">點我更新</button>
</div>

<script>
/* bumped by scripts/release.sh; must match version.json on release */
const APP_VERSION='2026.10.24-2246';
/* every person sets their own week: which lift days, how many cardio sessions, cycle on/off */
const LIFT_SLOTS=[{k:'back',def:'背',fruit:'grape'},{k:'chest',def:'胸',fruit:'berry'},{k:'legs',def:'腿',fruit:'melon'}];
const DEFAULT_SET={parts:{back:{on:true,name:'背'},chest:{on:true,name:'胸'},legs:{on:true,name:'腿'}},cardio:3,cycle:true,pain:true};
/* why the pain scores exist, shown wherever they appear */
const PAIN_WHY='大腦常高估運動有多累（Ruby 等人，2011），出門前先猜、練完再打分，就知道腦袋多想了幾分。';
let SET=JSON.parse(JSON.stringify(DEFAULT_SET)), PARTS=[], LIFT_GOAL=3, GOAL=6;
function applySettings(){
  PARTS=LIFT_SLOTS.filter(x=>SET.parts[x.k]?.on).map(x=>({k:x.k,n:(SET.parts[x.k].name||x.def).trim()||x.def,sub:'每組留 2–3 下就收',fruit:x.fruit}));
  LIFT_GOAL=PARTS.length;
  if(SET.cycle)PARTS.push({k:'period',n:'經期',sub:'輕重量，想練哪裡就練哪裡',fruit:'peach'});
  GOAL=Math.max(1,LIFT_GOAL+SET.cardio);
}
applySettings();
/* fruits drawn in a 40×40 box centred on 0,0 */
function fruit(t){
  if(t==='grape-g') return `<path d="M0 -13 Q1 -18 4 -20" stroke="#7A5230" stroke-width="2" fill="none" stroke-linecap="round"/><ellipse cx="7" cy="-16" rx="6" ry="3" fill="#5DBB63" transform="rotate(-20 7 -16)"/>
    <g fill="#C3E59A" stroke="#86B85E" stroke-width="1.2">${[[-8,-7],[0,-8],[8,-7],[-4,1],[4,1],[0,9]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="5.6"/>`).join('')}</g>`;
  if(t==='berry-w') return `<path d="M0 17 C-15 7 -17 -7 -9 -10 C-4 -12 4 -12 9 -10 C17 -7 15 7 0 17Z" fill="#E6F3D2" stroke="#A9CF8A" stroke-width="1.2"/>
    <g fill="#C9B86A">${[[-7,-3],[0,-4],[7,-3],[-4,4],[4,4],[0,10]].map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="1" ry="1.5"/>`).join('')}</g>
    <path d="M-9 -11 L-3 -10 L0 -16 L3 -10 L9 -11 L4 -7 L0 -9 L-4 -7Z" fill="#4CAF50" stroke="#388E3C" stroke-width="1" stroke-linejoin="round"/>`;
  if(t==='melon-g') return `<ellipse cx="0" cy="3" rx="12" ry="10" fill="#A8D97A" stroke="#5E9E3E" stroke-width="1.4"/>
    <g stroke="#5E9E3E" stroke-width="1.6" fill="none" stroke-linecap="round"><path d="M-6 -6 Q-9 3 -6 12"/><path d="M0 -7 Q-1 3 0 13"/><path d="M6 -6 Q9 3 6 12"/></g><path d="M0 -7 Q2 -11 5 -12" stroke="#7A5230" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
  if(t==='peach-g') return `<path d="M0 -11 Q1 -16 3 -18" stroke="#7A5230" stroke-width="2" fill="none" stroke-linecap="round"/><ellipse cx="8" cy="-15" rx="6.5" ry="3" fill="#5DBB63" transform="rotate(-25 8 -15)"/>
    <path d="M0 -11 C-15 -15 -19 3 -10 12 C-5 17 5 17 10 12 C19 3 15 -15 0 -11Z" fill="#D3EAA8" stroke="#96C26B" stroke-width="1.3"/><path d="M0 -10 Q-5 2 0 15" stroke="#96C26B" stroke-width="1.3" fill="none" opacity=".7"/>`;
  if(t==='bud') return `<path d="M0 -7 Q1 -12 3 -13" stroke="#7A5230" stroke-width="1.8" fill="none" stroke-linecap="round"/><ellipse cx="6" cy="-11" rx="5" ry="2.4" fill="#8CCB7A" transform="rotate(-20 6 -11)"/>
    <circle cx="0" cy="2" r="8" fill="#C9E8B4" stroke="#86BF72" stroke-width="1.4"/><circle cx="-3" cy="-1" r="2" fill="#fff" opacity=".6"/>`;
  if(t==='plus') return `<circle r="11" fill="none" stroke="#A39DC0" stroke-width="2" stroke-dasharray="4 3"/><path d="M-5 0 H5 M0 -5 V5" stroke="#A39DC0" stroke-width="2.4" stroke-linecap="round"/>`;

const SEASONS={

  summer:{n:'夏',e:'☀️',ph:'排卵期',tip:'精力最高峰。狀態好、想挑戰重量，就是這幾天。'},
  autumn:{n:'秋',e:'🍂',ph:'黃體期',tip:'精力開始下降，維持重量就好。情緒起伏是荷爾蒙的關係，不是你的問題。'}};
const DAY=864e5, dayDiff=(a,b)=>Math.round((parseKey(keyOf(a))-parseKey(keyOf(b)))/DAY);

  const gaps=[];for(let i=1;i<ps.length;i++)gaps.push(dayDiff(parseKey(ps[i].start),parseKey(ps[i-1].start)));
  const g=gaps.slice(-3).filter(x=>x>=21&&x<=40);

  return{ps,len:g.length?Math.round(g.reduce((a,b)=>a+b)/g.length):28,plen:lens.length?Math.round(lens.reduce((a,b)=>a+b)/lens.length):5};

  const day=dayDiff(d,parseKey(cur.start))+1;

  /* no end date yet: treat it as ongoing for a few days past the usual length, then assume the usual length */
  const open=!cur.end&&dayDiff(new Date(),parseKey(cur.start))+1<=plen+3;

function saveGoal(firstRun){
  const d=sdraft; LIFT_SLOTS.forEach(x=>{d.parts[x.k].name=(d.parts[x.k].name||'').trim()||x.def});
  SET={parts:d.parts,cardio:d.cardio,cycle:d.cycle,pain:d.pain}; local.set('settings',SET); applySettings();
  if(firstRun){menus=d.menu==='blank'?{back:[],chest:[],legs:[],period:[]}:JSON.parse(JSON.stringify(TEMPLATE_MENUS));local.set('menus',menus);mdraft=null;
    week=normalize(null);fillEmptyLifts()}
  else{week=normalize(week);fillEmptyLifts()}
  closeSheet();lastCount=-1;render();queueSave();
}

/* ---------- the session sheet ---------- */
let sheet=null;   // {t:'lift',k} | {t:'climb',i} | {t:'extra'}
const CLIMB_STEPS=[['warm','暖身','慢走或輕鬆動 5 分鐘'],['main','有氧 30 分鐘','前 5–10 分鐘放慢，維持在能講話的速度'],['cool','收操','慢走＋伸展練到的部位']];
function cur(){if(!week||!sheet)return null;return sheet.t==='lift'?week.lifts[sheet.k]:sheet.t==='climb'?week.climbs[sheet.i]:null}
function openSheet(s){sheet=s;delete sheet.diff;sel=null;pickDay=defaultDay();xdraft=s.t==='extra'?{type:'爬山',min:'',note:''}:null;
  $('#sheet').hidden=false;document.documentElement.style.overflow='hidden';renderSheet();$('#sheetBody').scrollTop=0;setTimeout(()=>$('#sheetClose')?.focus(),60)}
function closeSheet(){if(sheet&&sheet.t==='setup'&&!sheet.leaving)return;sheet=null;xdraft=null;$('#sheet').hidden=true;document.documentElement.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#deck').hidden){closeDeck();return}if(e.key==='Escape'&&sheet)closeSheet();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches?.('#gecko [role=button]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
const chk=(on,attrs,title,sub)=>`<li class="item wc${on?' ok':''}"><div class="irow"><button class="check" ${attrs} aria-pressed="${on}" aria-label="完成${title}">${on?'✓':''}</button>
  <div class="nm"><b>${title}</b><span>${sub}</span></div><span></span></div></li>`;
const painPre=(s,label,why)=>SET.pain?stepper('pre',label,s.pre)+(why?`<p class="tip">${PAIN_WHY}</p>`:''):'';
function stageGo(s){
  let inner;
  if(s.done){
    const t=[];if(s.planAt)t.push(`${hm(s.planAt)} 打算去`);if(s.departAt)t.push(`${hm(s.departAt)} 出門`);
    inner=`<p class="timeline">${t.length?t.join(' → '):'這次沒有記出門時間'}${s.planAt&&s.departAt?` · 拖了 <b>${dur(mins(s.planAt,s.departAt))}</b>`:''}</p>${painPre(s,'出門前預估痛苦')}`;
  }else if(s.departAt){
    inner=`<p class="timeline"><b>${hm(s.departAt)} 出門了</b>${s.planAt?` · 從打算到出門 ${dur(mins(s.planAt,s.departAt))}`:''}</p>${painPre(s,'出門前預估痛苦')}
      <button class="ghost" data-act="undepart">按錯了，還沒出門</button>`;
  }else if(s.planAt){
    inner=`<p class="timeline"><b>${hm(s.planAt)} 打算去</b> · 到現在 ${dur(mins(s.planAt,new Date().toISOString()))}</p>${painPre(s,'想到要去，覺得會多痛苦？',true)}
      <button class="go-btn" data-act="depart">出門了！</button><button class="ghost" data-act="unplan">今天先不去了</button>`;
  }else{
    inner=`<p class="timeline">決定要去的時候先按「今天打算去」，出門時再按一次，app 會算出拖了多久。</p>${painPre(s,'想到要去，覺得會多痛苦？',true)}
      <div class="btnrow"><button class="ghost" data-act="plan">今天打算去</button><button class="go-btn" style="padding:10px;font-size:15px" data-act="depart">已經出門了</button></div>
      <p class="tip">很抗拒的話：熱身完做第一個動作，就可以打卡。</p>`;
  }
  return `<section class="stage${!s.done&&!s.departAt?' cur':''}"><h4><i>1</i>出門前</h4>${inner}</section>`;
}
function stageDo(s){
  let list;
  if(sheet.t==='lift'){
    const P=PARTS.find(p=>p.k===sheet.k);
    const wc=(f)=>`<button class="wcbtn${s[f]?' ok':''}" data-act="wc" data-f="${f}" aria-pressed="${s[f]}"><span class="check">${s[f]?'✓':''}</span><span>${WC[f][0]}<br><small class="tip">${f==='warm'?'5–10 分鐘':'伸展放鬆'}</small></span></button>`;
    const lbl=x=>x.reps||x.kg?`${x.reps||'?'}×${x.kg||'–'}`:'未填';
    const branches=s.items.map((it,i)=>`<div class="branch">
        <button class="bname${sel&&sel.i===i&&sel.j<0?' sel':''}" data-act="pick" data-i="${i}" data-j="-1">${esc(it.name)||'新動作'}<small>${it.sets.filter(x=>x.ok).length}/${it.sets.length} 組</small></button>
        <div class="twig">${it.sets.map((x,j)=>`<button class="fr${x.ok?' ripe':''}${sel&&sel.i===i&&sel.j===j?' sel':''}" data-act="pick" data-i="${i}" data-j="${j}" aria-label="${esc(it.name)} 第 ${j+1} 組，${lbl(x)}${x.ok?'，完成':''}">${icon(x.ok?P.fruit:GARDEN[sheet.k].bud)}<small>${lbl(x)}</small></button>`).join('')}
          <button class="fr plus" data-act="addset" data-i="${i}" aria-label="${esc(it.name)} 加一組">${icon('plus')}<small>加一組</small></button></div>
      </div>`).join('');
    let ed='';
    if(sel&&s.items[sel.i]){
      const it=s.items[sel.i];
      if(sel.j>=0&&it.sets[sel.j]){const x=it.sets[sel.j],id=`${sel.i}-${sel.j}`;
        ed=`<div class="setedit"><h5>${esc(it.name)||'新動作'} · 第 ${sel.j+1} 組<button class="xbtn" style="width:28px;height:28px;font-size:12px" data-act="unpick" aria-label="收起">✕</button></h5>
          <div class="two"><div class="fld"><label for="sr-${id}">次數</label><input id="sr-${id}" data-set="reps" value="${esc(x.reps)}" inputmode="numeric" placeholder="10"></div>
          <div class="fld"><label for="sk-${id}">重量 (kg)</label><input id="sk-${id}" data-set="kg" value="${esc(x.kg)}" inputmode="decimal" placeholder="40"></div></div>
          <button class="ripe-btn${x.ok?' undo':''}" data-act="ripe">${x.ok?'改回還沒做':'這組完成，採下來！'}</button>
          <div class="acts"><button data-act="copyset">⧉ 複製成下一組</button><button class="danger" data-act="delset">刪掉這組</button></div></div>`;
      }else{const id=`${sel.i}`;
        ed=`<div class="setedit"><h5>這個動作<button class="xbtn" style="width:28px;height:28px;font-size:12px" data-act="unpick" aria-label="收起">✕</button></h5>
          <div class="fld"><label for="en-${id}">動作名稱</label><input id="en-${id}" data-ex="name" value="${esc(it.name)}" placeholder="例：硬舉"></div>
          <div class="acts"><button data-act="ripeall">全部組數一起採收</button><button class="danger" data-act="idel">這次不做這個動作</button></div></div>`;}

    const all=s.items.flatMap(it=>it.sets), done=all.filter(x=>x.ok);

    list=`<div class="wcrow">${wc('warm')}${wc('cool')}</div>
      ${s.items.length?`<div class="tree g-${sheet.k}">${branches}<span class="soil"></span></div>`:`<p class="empty">還沒有${P.n}日菜單，可以在下面種一株新的</p>`}
      ${ed}
      <div class="harvest"><span>採收 <b>${done.length}/${all.length}</b> 顆</span><span>總重量 <b>${Math.round(vol).toLocaleString()}</b> kg</span></div>
      <button class="addone" data-act="iadd">＋ 種一株新的（新動作）</button>`;
  }else{
    list=`<ul class="items">${CLIMB_STEPS.map(([f,a,b])=>chk(s[f],`data-act="wc" data-f="${f}"`,a,b)).join('')}</ul>`;
  }
  return `<section class="stage${s.departAt&&!s.done?' cur':''}"><h4><i>2</i>${sheet.t==='lift'?`今天的${GARDEN[sheet.k].n}<span class="tip" style="margin-left:auto">點果實改那一組</span>`:'有氧'}</h4>${list}</section>`;
}
function stageEnd(s){
  const day=s.done?(keyOfMD(s.date)||pickDay):pickDay;
  return `<section class="stage"><h4><i>3</i>練完</h4>${SET.pain?stepper('post','實際有多痛苦？',s.post):''}${datePicker(day)}
    <button class="stamp-btn${s.done?' undo':(!s.departAt&&sheet.t!=='extra'?' quiet':'')}" data-act="done">${s.done?'取消打卡':'打卡！'}</button></section>`;
}
function renderSheet(){
  if(!sheet||!week) return;
  let ic,title,sub,body;
  $('#sheetClose').hidden=sheet.t==='setup';
  if(sheet.t==='setup'||sheet.t==='goal'){
    $('#sheetIcon').innerHTML=icon('grape');$('#sheetTitle').innerHTML=sheet.t==='setup'?'開始之前<small>30 秒訂好你的每週目標</small>':'每週目標<small>改了之後，這週起就照新目標算</small>';
    $('#sheetBody').innerHTML=sheet.t==='setup'?renderSetup():goalBody()+'<button class="stamp-btn" data-act="ssave">儲存</button>';return}
  if(sheet.t==='extra'){
    ic='cherry';title='額外運動';sub='每一筆抵一次，放一顆櫻桃';
    const xs=week.extras, other=!XTYPES.slice(0,-1).includes(xdraft.type);
    body=`${xs.length?`<section class="stage"><h4>這週記過的</h4><ul class="xlist">${xs.map((x,i)=>`<li class="xitem">${icon('cherry')}<div><b>${esc(x.type)}${x.min?` · ${esc(x.min)} 分鐘`:''}</b><span>${esc(x.date)}${x.note?' · '+esc(x.note):''}</span></div>
        <button data-act="xdel" data-i="${i}" aria-label="刪除這筆額外運動">✕</button></li>`).join('')}</ul></section>`:''}
      <section class="stage cur"><h4>記一筆</h4>
      <div class="chips">${XTYPES.map(t=>`<button data-act="xtype" data-t="${t}" aria-pressed="${t==='其他'?other:xdraft.type===t}">${t}</button>`).join('')}</div>
      ${other?`<div class="fld"><label for="xcustom">運動名稱</label><input id="xcustom" data-x="type" value="${esc(xdraft.type==='其他'?'':xdraft.type)}" placeholder="例：騎腳踏車"></div>`:''}
      <div class="two"><div class="fld"><label for="xmin">分鐘</label><input id="xmin" data-x="min" value="${esc(xdraft.min)}" inputmode="numeric" placeholder="60"></div>
      <div class="fld"><label for="xnote">一句話備註</label><input id="xnote" data-x="note" value="${esc(xdraft.note)}" placeholder="例：和朋友爬七星山"></div></div>
      ${datePicker(pickDay)}
      <button class="stamp-btn" data-act="xsave">記下來</button></section>`;
  }else{
    const s=cur();
    if(sheet.t==='lift'){const P=PARTS.find(p=>p.k===sheet.k);ic=P.fruit;title=P.n+'日';sub=P.sub}
    else{ic='banana';title='有氧 30 分鐘';sub='跑步、爬坡、飛輪、快走都可以'}
    if(sheet.diff){const d=sheet.diff, row=(n,kind)=>`<li class="item wc${d.pick[n]?' ok':''}"><div class="irow"><button class="check" data-act="dpick" data-n="${esc(n)}" aria-pressed="${!!d.pick[n]}" aria-label="${kind}${esc(n)}">${d.pick[n]?'✓':''}</button>
        <div class="nm"><b>${esc(n)}</b><span>${kind==='加進'?'這次新增的，加進固定菜單':'這次沒做，從固定菜單拿掉'}</span></div><span></span></div></li>`;
      $('#sheetIcon').innerHTML=icon(ic);$('#sheetTitle').innerHTML=`${title}打卡了！<small>這次和固定菜單不太一樣</small>`;
      $('#sheetBody').innerHTML=`<section class="stage cur"><h4>要更新固定菜單嗎？</h4><p class="timeline">勾起來的會存進「編輯菜單」，下次${esc(title)}就會照這樣。</p>
        <ul class="items">${d.added.map(n=>row(n,'加進')).join('')}${d.removed.map(n=>row(n,'拿掉')).join('')}</ul>
        <div class="btnrow"><button class="ghost" data-act="dskip">這次就好</button><button class="stamp-btn" style="padding:10px" data-act="dapply">更新菜單</button></div></section>`;
      return}
    const tabs=sheet.t==='climb'?`<div class="tabs" role="tablist">${week.climbs.map((c,i)=>`<button role="tab" aria-selected="${sheet.i===i}" data-act="ctab" data-i="${i}">第 ${i+1} 次${c.done?' ✓':''}</button>`).join('')}</div>`:'';
    body=tabs+stageGo(s)+stageDo(s)+stageEnd(s);
  }
  $('#sheetIcon').innerHTML=icon(ic);

function collect(w,pre,post,lag){
  [...PARTS.map(p=>w.lifts[p.k]),...w.climbs].forEach(s=>{if(s.pre!=null)pre.push(s.pre);if(s.post!=null)post.push(s.post);if(s.planAt&&s.departAt)lag.push(mins(s.planAt,s.departAt))});
}
const avg=a=>a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):'–';
const gap=(pre,post)=>pre.length&&post.length?(()=>{const d=(avg(pre)-avg(post)).toFixed(1);return (d>0?'+':'')+d})():'–';
const lagTxt=a=>a.length?dur(Math.round(a.reduce((x,y)=>x+y,0)/a.length)):'–';
function renderStats(){
  const pre=[],post=[],lag=[]; collect(week||blankWeek(),pre,post,lag);
  $('#statsTitle').innerHTML=SET.pain?'預估 vs 實際 <span>這週的平均</span>':'出門紀錄 <span>這週的平均</span>';
  $('#statsWhy').textContent=SET.pain?PAIN_WHY:'';$('#statsWhy').hidden=!SET.pain;
  $('#stats').innerHTML=(SET.pain?`<div class="stat"><span>出門前預估</span><b>${avg(pre)}</b></div><div class="stat"><span>練完實際</span><b>${avg(post)}</b></div>
    <div class="stat"><span>腦袋多想了</span><b>${gap(pre,post)}</b></div>`:'')+`<div class="stat"><span>平均拖了</span><b style="font-size:18px">${lagTxt(lag)}</b></div>`;
}

      <input class="mname" id="mn-${mtab}-${i}" data-m="name" data-i="${i}" value="${esc(r.name)}" placeholder="動作名稱" aria-label="動作名稱">

    :`<div class="empty">這一天還沒有動作</div>`;

const XTYPES=['爬山','游泳','跑步','瑜珈','球類','其他'];
let xdraft=null;
/* nudge after 14 days without a backup (3 days of use if never backed up) */
function renderNudge(){
  const now=Date.now(), D=864e5, last=local.get('lastBackup'), first=local.get('firstUse')||now, snooze=local.get('backupSnooze')||0;
  const hasData=Object.values(allWeeks).some(w=>w&&(Object.values(w.lifts||{}).some(l=>l&&l.done)||(w.climbs||[]).some(c=>c&&c.done)||(w.extras||[]).length));
  const days=last?Math.floor((now-last)/D):null;
  const show=hasData&&now>snooze&&(last?days>=14:now-first>=3*D);

  pop(){tone(520,0,.12,'triangle',.14,980)},
  stamp(){[523,659,784].forEach((f,i)=>tone(f,i*.09,.28,'triangle',.11))},
  full(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.08,.4,'triangle',.1));tone(2093,.45,.5,'sine',.05)},
  jam(){tone(180,0,.25,'sine',.16,90);tone(240,.18,.25,'sine',.12,120)}};
function play(n){if(soundOn)SFX[n]?.()}
$('#soundSw').setAttribute('aria-checked',soundOn);
$('#soundSw').addEventListener('click',()=>{soundOn=!soundOn;local.set('sound',soundOn);$('#soundSw').setAttribute('aria-checked',soundOn);if(soundOn)play('pop')});

/* ---------- effects ---------- */
const reduceMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function burst(x,y,kinds,n=10,spread=110){
  if(reduceMotion())return;
  for(let i=0;i<n;i++){const el=document.createElement('span'),k=kinds[i%kinds.length],a=Math.random()*Math.PI*2,d=spread*(.45+Math.random()*.55);
    el.className='spark'+(k.startsWith('#')?' dot':'');if(k.startsWith('#'))el.style.setProperty('--c',k);else el.innerHTML=icon(k);
    el.style.left=x+'px';el.style.top=y+'px';el.style.setProperty('--dx',Math.cos(a)*d+'px');el.style.setProperty('--dy',Math.sin(a)*d-30+'px');
    el.style.setProperty('--r',(Math.random()*240-120)+'deg');el.style.setProperty('--t',(.7+Math.random()*.5)+'s');
    document.body.appendChild(el);setTimeout(()=>el.remove(),1300)}
}
function rain(kinds,n=28){
  if(reduceMotion())return;
  const w=innerWidth;for(let i=0;i<n;i++){const el=document.createElement('span'),k=kinds[i%kinds.length];el.className='spark';el.innerHTML=icon(k);
    el.style.left=Math.random()*w+'px';el.style.top='-30px';el.style.setProperty('--dx',(Math.random()*80-40)+'px');el.style.setProperty('--dy',(innerHeight*.6+Math.random()*innerHeight*.4)+'px');
    el.style.setProperty('--r',(Math.random()*360-180)+'deg');el.style.setProperty('--t',(1.2+Math.random()*1.1)+'s');el.style.animationDelay=Math.random()*.5+'s';
    document.body.appendChild(el);setTimeout(()=>el.remove(),3000)}
}
const centerOf=el=>{const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]};

/* ---------- jam jars: one per month ---------- */
const JAM={grape:'#7B4BC4',berry:'#D93A4A',melon:'#E8566A',peach:'#F2945F',banana:'#E2B23A',cherry:'#A8203A'};
function monthTally(y,mo){
  const ev=eventsByDay(), last=new Date(y,mo+1,0), by={}; let total=0;
  for(let d=1;d<=last.getDate();d++){(ev[keyOf(new Date(y,mo,d))]||[]).forEach(e=>{const f=e.t==='l'?e.f:e.t==='x'?'cherry':'banana';by[f]=(by[f]||0)+1;total++})}
  const top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];
  return{total,fill:Math.min(1,total/(GOAL*last.getDate()/7)),color:top?JAM[top[0]]:null,top:top?.[0]};
}
function jarSVG(t,id,label){
  const h=t.fill*46, y=78-h;
  return `<svg viewBox="0 0 60 92" aria-hidden="true"><defs><clipPath id="jc-${id}"><path d="M10 26 Q8 26 8 32 V80 Q8 86 14 86 H46 Q52 86 52 80 V32 Q52 26 50 26 Z"/></clipPath></defs>
    <path d="M10 26 Q8 26 8 32 V80 Q8 86 14 86 H46 Q52 86 52 80 V32 Q52 26 50 26 Z" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>
    ${t.color?`<g clip-path="url(#jc-${id})"><rect x="0" y="${y}" width="60" height="${h+10}" fill="${t.color}"/><path d="M0 ${y} Q15 ${y-3} 30 ${y} T60 ${y}" fill="${t.color}"/><rect x="0" y="${y+2}" width="60" height="4" fill="#fff" opacity=".18"/></g>`:''}
    <path d="M14 34 V70" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".45"/>
    <rect x="12" y="18" width="36" height="9" rx="2" fill="var(--basket-line)"/>
    <path d="M6 18 Q30 6 54 18 L50 24 Q30 16 10 24 Z" fill="${t.color||'var(--muted)'}" opacity=".9"/>
    <g fill="#fff" opacity=".5"><rect x="16" y="14" width="5" height="4"/><rect x="27" y="11" width="5" height="4"/><rect x="38" y="14" width="5" height="4"/></g>
    <rect x="16" y="46" width="28" height="16" rx="3" fill="#FFFDF6" stroke="var(--line)"/><text x="30" y="58" text-anchor="middle" font-size="10" font-family="var(--num)" fill="#3A2B20">${label}</text></svg>`;
}
function renderShelf(){
  const now=new Date(), months=[];
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(d)}
  const cells=months.map((d,i)=>{const t=monthTally(d.getFullYear(),d.getMonth()),cur=i===months.length-1;
    if(!t.total&&!cur)return '';
    return `<button class="jar${cur?' cur':''}" data-act="jarmonth" data-y="${d.getFullYear()}" data-m="${d.getMonth()}" aria-label="${d.getMonth()+1} 月果醬，完成 ${t.total} 次">
      ${jarSVG(t,`${d.getFullYear()}${d.getMonth()}`,`${d.getMonth()+1}月`)}<small>${cur?'熬煮中':`${t.total} 次`}</small></button>`}).join('');
  $('#shelf').innerHTML=cells;
  const sh=$('#shelf');sh.scrollLeft=sh.scrollWidth;
}
/* last month's jar is ready: invite her to the shelf once */
function jarReady(){const n=new Date(),p=new Date(n.getFullYear(),n.getMonth()-1,1),k=`${p.getFullYear()}-${p.getMonth()+1}`;
  if(local.get('jarSeen')===k)return null;const t=monthTally(p.getFullYear(),p.getMonth());return t.total?{k,t,m:p.getMonth()+1,y:p.getFullYear(),mo:p.getMonth()}:null}

/* ---------- "今天真的很不想運動" decision cards ---------- */
const FACES={
  sus:`<circle cx="60" cy="60" r="52" fill="#FFD966" stroke="#C9A227" stroke-width="3"/>
    <path d="M30 40 Q42 30 54 38" stroke="#4A3A10" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M68 46 H92" stroke="#4A3A10" stroke-width="5" stroke-linecap="round"/>
    <path d="M34 54 Q42 50 50 54" stroke="#4A3A10" stroke-width="5" fill="none" stroke-linecap="round"/><ellipse cx="80" cy="56" rx="7" ry="4" fill="#4A3A10"/>
    <path d="M46 84 Q62 78 76 86" stroke="#4A3A10" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="96" cy="30" r="9" fill="#fff" stroke="#C9A227" stroke-width="2"/><text x="96" y="35" text-anchor="middle" font-size="14" font-weight="700" fill="#C9A227">?</text>`,
  think:`<circle cx="60" cy="60" r="52" fill="#FFD966" stroke="#C9A227" stroke-width="3"/>
    <circle cx="44" cy="52" r="6" fill="#4A3A10"/><circle cx="78" cy="52" r="6" fill="#4A3A10"/><circle cx="46" cy="50" r="2" fill="#fff"/><circle cx="80" cy="50" r="2" fill="#fff"/>
    <path d="M48 82 H74" stroke="#4A3A10" stroke-width="5" stroke-linecap="round"/><circle cx="88" cy="86" r="10" fill="#F2C744" stroke="#C9A227" stroke-width="2"/><path d="M82 80 L90 74" stroke="#C9A227" stroke-width="3" stroke-linecap="round"/>`,
  go:`<circle cx="60" cy="60" r="52" fill="#FFD966" stroke="#C9A227" stroke-width="3"/>
    <path d="M34 50 Q42 40 50 50" stroke="#4A3A10" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M70 50 Q78 40 86 50" stroke="#4A3A10" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M38 70 Q60 98 82 70 Z" fill="#7A2E1E"/><path d="M48 80 Q60 90 72 80" fill="#F07A7A"/><path d="M98 34 q4 8 0 14 q-4 -6 0 -14Z" fill="#7EC8F0"/>`,
  rest:`<circle cx="60" cy="60" r="52" fill="#FFE6A8" stroke="#C9A227" stroke-width="3"/>
    <path d="M34 54 Q42 60 50 54" stroke="#4A3A10" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M70 54 Q78 60 86 54" stroke="#4A3A10" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="60" cy="80" rx="7" ry="5" fill="#7A2E1E"/><circle cx="38" cy="68" r="6" fill="#FFB0A0" opacity=".6"/><circle cx="82" cy="68" r="6" fill="#FFB0A0" opacity=".6"/>
    <text x="92" y="30" font-size="18" font-weight="700" fill="#6F9BE0">z</text><text x="102" y="18" font-size="13" font-weight="700" fill="#6F9BE0">z</text>`};
const face=k=>`<svg class="face" viewBox="0 0 120 120" aria-hidden="true">${FACES[k]}</svg>`;
/* each question: [question, yes label, no label, yes → node, no → node] */
function deckNodes(){
  const n=count(), afterSleep=SET.cycle?'q3':'q4';
  return{
    start:{intro:true},
    q1:['你是真的生病、受傷，或發燒了嗎？','是，真的不舒服','沒有啦','r_sick','q2'],
    q2:['昨天睡不到 6 小時？','對，睡很少','有睡飽','q2b',afterSleep],
    q2b:['現在眼皮重到可以夾住一支筆？','可以，超睏','還撐得住','r_sleep',afterSleep],
    q3:['現在是經期，而且肚子很不舒服？','是，很不舒服','還好','r_period','q4'],
    q4:['老實說，是「真的很累」，還是「想到就覺得累」？','真的很累','想到就累','q5','r_brain'],
    q5:[`這週的籃子已經摘了一半以上嗎？（現在 ${n}/${GOAL}）`,'有，超過一半','還沒','q6','r_mini'],
    q6:['如果只做熱身＋第一個動作，做完就能回家，你願意嗎？','好啦可以','連這個都不想','r_mini','r_earned'],
    r_sick:{go:false,line:'身體在求救。今天的任務是躺好、多喝水。'},
    r_sleep:{go:false,line:'肌肉是在睡覺時長的。今天早點睡，也算在訓練。'},
    r_period:{go:false,line:'冬天就好好過冬。真的想動，做 10 分鐘伸展就算數。'},
    r_brain:{go:true,line:'那是腦袋在播誇張的預告片。實際去了，通常沒那麼痛。'},
    r_mini:{go:true,line:'只要熱身＋第一個動作，做完想走就走。水果在等你！'},
    r_earned:{go:false,line:'這週已經很努力了。今天休息，明天再來摘。'}};
}
let deckPath=[], deckDir='';
function openDeck(){deckPath=['start'];deckDir='';$('#deck').hidden=false;document.documentElement.style.overflow='hidden';renderDeck()}
function closeDeck(){$('#deck').hidden=true;document.documentElement.style.overflow=''}
function renderDeck(){
  const N=deckNodes(), id=deckPath[deckPath.length-1], node=N[id], qs=deckPath.filter(x=>x.startsWith('q')).length;
  const top=`<div class="deck-top">${deckPath.length>1&&!id.startsWith('r_')?'<button class="back" data-act="dback">← 上一題</button>':'<span></span>'}<button class="xbtn" data-act="dclose" aria-label="關閉">✕</button></div>`;
  let card;
  if(node.intro) card=`${face('sus')}<h3>嗯？你確定嗎？</h3><p>先別急著躺平。回答幾個問題，讓水果籃幫你判斷今天該去還是該休息。</p>
    <div class="answers"><button class="pri" data-act="dnext" data-to="q1">好，問吧</button></div>`;
  else if(Array.isArray(node)) card=`${face('think')}<span class="qno">第 ${qs} 題</span><h3>${node[0]}</h3>
    <div class="answers"><button data-act="dnext" data-to="${node[3]}">${node[1]}</button><button data-act="dnext" data-to="${node[4]}">${node[2]}</button></div>`;
  else card=`<div class="drum" id="drum" aria-live="polite"></div><div id="verdict" hidden></div>`;
  $('#deck').innerHTML=top+`<div class="dcard ${deckDir}">${card}</div>`;
  if(id.startsWith('r_')) drumroll(node);
}
function drumroll(node){
  const words=['登','、登','、登','、登……'], drum=$('#drum');
  words.forEach((w,i)=>setTimeout(()=>{if($('#deck').hidden)return;drum.insertAdjacentHTML('beforeend',`<span>${w}</span>`);if(soundOn){tone(98,0,.22,'triangle',.3,60);tone(196,0,.08,'square',.04)}},i*420));
  setTimeout(()=>{if($('#deck').hidden)return;const v=$('#verdict');v.hidden=false;
    v.innerHTML=`${face(node.go?'go':'rest')}<h3 class="verdict${node.go?'':' rest'}">${node.go?'你應該去運動！':'今天休息！'}</h3><p>${node.line}</p>
      <div class="answers">${node.go?'<button class="pri" data-act="dgo">好啦我去</button>':'<button class="pri" data-act="dclose">好好休息</button>'}<button data-act="dagain">重來一次</button></div>`;
    if(node.go){rain(['grape','berry','melon','peach','banana','cherry'],26);if(soundOn)SFX.full()}
    else{if(!reduceMotion())for(let i=0;i<6;i++){const z=document.createElement('span');z.className='zz';z.textContent=i%2?'z':'Z';z.style.left=(30+Math.random()*40)+'%';z.style.top='62%';z.style.setProperty('--dx',(Math.random()*80-40)+'px');z.style.animationDelay=i*.25+'s';document.body.appendChild(z);setTimeout(()=>z.remove(),4000)}
      if(soundOn)[784,659,523,392].forEach((f,i)=>tone(f,i*.18,.5,'sine',.09))}
  },words.length*420+250);
}
document.addEventListener('click',e=>{const b=e.target.closest('#deck [data-act]');if(!b)return;e.stopPropagation();const a=b.dataset.act;
  if(a==='dclose'){closeDeck();return}
  if(a==='dnext'){deckPath.push(b.dataset.to);deckDir='';renderDeck();return}
  if(a==='dback'){deckPath.pop();deckDir='backward';renderDeck();return}
  if(a==='dagain'){deckPath=['start'];deckDir='';renderDeck();return}
  if(a==='dgo'){closeDeck();toast('出發！到了記得點水果、按「已經出門了」');return}
},true);

/* ---------- appearance ---------- */
function applyTheme(t){
  const r=document.documentElement;
  if(t==='light'||t==='dark')r.dataset.theme=t; else delete r.dataset.theme;
  /* a forced theme also sets the status-bar colour, whatever the phone setting */
  const L='#F2F7F1',Dk='#132019';
  $('#tcLight').content=t==='dark'?Dk:L; $('#tcDark').content=t==='light'?L:Dk;
  document.querySelectorAll('[data-theme-opt]').forEach(b=>b.setAttribute('aria-checked',b.dataset.themeOpt===(t||'auto')));
}
$('#themeSeg').addEventListener('click',e=>{const b=e.target.closest('[data-theme-opt]');if(!b)return;const t=b.dataset.themeOpt;local.set('theme',t);applyTheme(t)});
applyTheme(local.get('theme')||'auto');

/* ---------- update check ---------- */
let latest=null;
async function checkUpdate(){
  try{
    const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) return;
    const j=await r.json();
    if(j.version&&j.version!==APP_VERSION){latest=j.version;$('#updateText').textContent=j.notes?`有新版本：${j.notes}`:'有新版本';$('#updateBar').hidden=false}
  }catch(e){}
}
$('#updateBtn').addEventListener('click',async()=>{await flush();location.replace('./?v='+encodeURIComponent(latest||Date.now()))});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
setInterval(checkUpdate,30*60*1000);
checkUpdate();

/* ---------- boot ---------- */
render();
(()=>{
  try{ navigator.storage?.persist?.() }catch(e){}
  if(!local.get('firstUse'))local.set('firstUse',Date.now());
  loadAllLocal();
  const saved=local.get('settings'), returning=!!local.get('menus')||Object.keys(allWeeks).length>0;
  if(saved){SET=Object.assign(JSON.parse(JSON.stringify(DEFAULT_SET)),saved)}else if(returning){local.set('settings',SET)}
  applySettings();
  menus=local.get('menus')||(returning?STARTER_MENUS:TEMPLATE_MENUS); if(!menus.period)menus.period=STARTER_MENUS.period;
  cycle=local.get('cycle')||{periods:[]};
  loadWeek();
  if(!saved&&!returning){sdraft=Object.assign(JSON.parse(JSON.stringify(DEFAULT_SET)),{menu:'template',pain:false});openSheet({t:'setup',step:1})}
})();
</script>
